<script>
        function getConfigData() {
            const bandName = document.getElementById('bandNameInput').value.trim();
            const membersRaw = document.getElementById('membersInput').value;
            const members = membersRaw.split(',').map(m => m.trim()).filter(m => m.length > 0);
            const ugPlaylistUrl = document.getElementById('ugUrlInput').value.trim();
            
            return {
                bandName,
                members,
                ugPlaylistUrl
            };
        }

        function updateJsonPreview() {
            const data = getConfigData();
            const formatted = JSON.stringify(data, null, 2);
            
            // Generates the exact file format snippet block that your update.yml script expects
            const fullBlock = `--------------------------------------------------------------------------------\nDOSYA: ./config.json\n--------------------------------------------------------------------------------\n` + formatted;
            
            document.getElementById('jsonOutput').innerText = fullBlock;
        }

        async function fetchExistingConfig() {
            try {
                const res = await fetch('./config.json?v=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (data.bandName) document.getElementById('bandNameInput').value = data.bandName;
                    if (data.members) document.getElementById('membersInput').value = data.members.join(', ');
                    if (data.ugPlaylistUrl) document.getElementById('ugUrlInput').value = data.ugPlaylistUrl;
                }
            } catch (e) {
                console.log('Using default form fields.');
            }
            updateJsonPreview();
        }

        function generateConfigBlock() {
            const outputText = document.getElementById('jsonOutput').innerText;
            navigator.clipboard.writeText(outputText).then(() => {
                alert('GitHub Action compatible code copied to clipboard! You can paste it directly into your update.yml workflow or commit.');
            }).catch(err => {
                console.error('Copy failed:', err);
                alert('Copy failed. Please manually select and copy the text in the box.');
            });
        }

        document.getElementById('bandNameInput').addEventListener('input', updateJsonPreview);
        document.getElementById('membersInput').addEventListener('input', updateJsonPreview);
        document.getElementById('ugUrlInput').addEventListener('input', updateJsonPreview);

        // Initialize on load
        fetchExistingConfig();
    </script>
