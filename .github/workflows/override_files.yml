name: Universal Payload Execution Engine

on:
  workflow_dispatch:
    inputs:
      code_payload:
        description: 'Paste your raw text payload here'
        required: true
        type: string

permissions:
  contents: write

jobs:
  execute_payload:
    runs-on: ubuntu-latest
    name: Execute Unpacked Payload

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & Playwright
        run: |
          mkdir -p core .github/workflows songs
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Parse and Unpack Files Line-By-Line
        env:
          RAW_PAYLOAD: ${{ inputs.code_payload }}
        run: |
          python3 - << 'PYEOF'
          import os

          payload = os.environ.get("RAW_PAYLOAD", "")
          if not payload.strip():
              raise ValueError("Payload input was empty.")

          lines = payload.splitlines()
          current_file = None
          buffer = []
          files_written = 0

          def save_file(filepath, content_lines):
              if not filepath:
                  return
              dirpath = os.path.dirname(filepath)
              if dirpath:
                  os.makedirs(dirpath, exist_ok=True)
              with open(filepath, "w", encoding="utf-8") as f:
                  f.write("\n".join(content_lines) + "\n")
              print(f"[Engine] Successfully wrote: {filepath}")

          for line in lines:
              stripped = line.strip()
              if stripped.startswith("=== FILE:") and stripped.endswith("==="):
                  # Flush previous file content to disk
                  if current_file:
                      save_file(current_file, buffer)
                      files_written += 1
                      buffer = []
                  # Extract new filename target
                  current_file = stripped[8:-3].strip()
              else:
                  if current_file is not None:
                      buffer.append(line)

          # Flush remaining buffer
          if current_file and buffer:
              save_file(current_file, buffer)
              files_written += 1

          if files_written == 0:
              raise ValueError("No valid '=== FILE: path ===' sections were detected.")

          print(f"[Engine] Unpacking complete. Total files processed: {files_written}")
          PYEOF

      - name: Execute Automated Scraper & Lyrics Engine
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
        run: |
          if [ -f "scraper.py" ]; then
            python3 scraper.py
          fi

      - name: Commit and Push Updated Application State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          
          if git diff --staged --quiet; then
            echo "No repository changes detected after payload execution."
          else
            git commit -m "build(payload): executed remote text payload update"
            git push
          fi
