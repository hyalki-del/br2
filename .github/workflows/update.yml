name: Single Block Repository Updater

on:
  workflow_dispatch:
    inputs:
      code_block:
        description: 'Paste the entire multi-file code block here'
        required: true
        type: string

jobs:
  update-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Parse and Write Files
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const rawInput = context.payload.inputs.code_block;
            const regex = /===\s*FILE:\s*([^\s=]+)\s*===/g;
            let match;
            let fileEntries = [];

            while ((match = regex.exec(rawInput)) !== null) {
              fileEntries.push({
                filePath: match[1].trim(),
                headerEnd: regex.lastIndex,
                headerStart: match.index
              });
            }

            if (fileEntries.length === 0) {
              core.setFailed("No valid '=== FILE: filename ===' markers found in input.");
              return;
            }

            for (let i = 0; i < fileEntries.length; i++) {
              const current = fileEntries[i];
              const nextStart = (i + 1 < fileEntries.length) ? fileEntries[i + 1].headerStart : rawInput.length;
              let content = rawInput.substring(current.headerEnd, nextStart);

              const dir = path.dirname(current.filePath);
              if (!fs.existsSync(dir)) {
                fs.mkdirSync(dir, { recursive: true });
              }

              fs.writeFileSync(current.filePath, content, 'utf8');
              console.log(`Successfully updated: ${current.filePath}`);
            }

      - name: Inject Automatic Commit Hash for Cache-Busting
        run: |
          COMMIT_HASH=$(echo $GITHUB_SHA | cut -c1-7)
          echo "Injecting Cache-Busting SHA: $COMMIT_HASH"
          sed -i "s/\?v=BUILD_SHA/\?v=$COMMIT_HASH/g" index.html || true
          sed -i "s/\?v=BUILD_SHA/\?v=$COMMIT_HASH/g" setup.html || true

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Integrated PWA, OpenGraph, and Automated Cache-Busting" || echo "No changes to commit"
          git push
