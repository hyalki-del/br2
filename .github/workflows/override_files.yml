name: Universal Payload Execution Engine

on:
  workflow_dispatch:
    inputs:
      code_payload:
        description: 'Paste your complete execution text payload here'
        required: true
        type: string

permissions:
  contents: write

jobs:
  execute_payload:
    runs-on: ubuntu-latest
    name: Execute Dynamic File Payload

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & Playwright
        run: |
          mkdir -p core .github/workflows songs
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Extract Raw Payload File
        run: |
          python3 - << 'PYEOF'
          import json, os

          event_path = os.environ.get("GITHUB_EVENT_PATH")
          with open(event_path, "r", encoding="utf-8") as f:
              event_data = json.load(f)

          payload_text = event_data.get("inputs", {}).get("code_payload", "")

          if not payload_text.strip():
              raise ValueError("Payload input was empty.")

          with open("execute_payload.sh", "w", encoding="utf-8", newline="\n") as out:
              out.write(payload_text)

          print("[Engine] Script written successfully to execute_payload.sh")
          PYEOF

      - name: Execute Script Payload
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
        run: |
          # Sanitize DOS line endings and make script executable
          sed -i 's/\r$//' execute_payload.sh
          chmod +x execute_payload.sh

          # Execute generated script file
          ./execute_payload.sh

          # Clean up temporary execution script
          rm execute_payload.sh

      - name: Commit and Push Updated Application State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          
          if git diff --staged --quiet; then
            echo "No repository changes detected after payload execution."
          else
            git commit -m "build(payload): executed remote text payload update"
            git push
          fi
