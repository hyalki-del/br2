name: Single Block Repository Updater

on:
  workflow_dispatch:
    inputs:
      code_block:
        description: 'Paste the entire multi-file code block here'
        required: true
        type: string

jobs:
  update-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Parse and Update Files
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const rawInput = context.payload.inputs.code_block;
            const lines = rawInput.split(/\r?\n/);

            let currentFile = null;
            let currentBuffer = [];
            let updatedCount = 0;

            for (const line of lines) {
              const match = line.trim().match(/^===\s*FILE:\s*(.+?)\s*===$/);
              if (match) {
                if (currentFile) {
                  const dir = path.dirname(currentFile);
                  if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });
                  fs.writeFileSync(currentFile, currentBuffer.join('\n'), 'utf8');
                  console.log(`Updated: ${currentFile}`);
                  updatedCount++;
                }
                currentFile = match[1].trim();
                currentBuffer = [];
              } else {
                if (currentFile !== null) {
                  currentBuffer.push(line);
                }
              }
            }

            if (currentFile) {
              const dir = path.dirname(currentFile);
              if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });
              fs.writeFileSync(currentFile, currentBuffer.join('\n'), 'utf8');
              console.log(`Updated: ${currentFile}`);
              updatedCount++;
            }

            if (updatedCount === 0) {
              core.setFailed("No valid '=== FILE: filename ===' markers found in input.");
            }

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Bulk update via single block action" || echo "No changes to commit"
          git push
