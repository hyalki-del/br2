 <!DOCTYPE html> <html lang="tr"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">     <title>Baba Rock</title>     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">     <link rel="preconnect" href="https://fonts.googleapis.com">     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>     <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">          <script>         (function() {             const savedTheme = localStorage.getItem('babarock_theme') || 'apple';             document.documentElement.setAttribute('data-theme', savedTheme);         })();     </script>          <link rel="stylesheet" href="css/core.css?v=e8204b8">     <link rel="stylesheet" href="css/theme-apple.css?v=e8204b8">     <link rel="stylesheet" href="css/theme-marvel.css?v=e8204b8">     <link rel="stylesheet" href="css/theme-wb.css?v=e8204b8"> </head> <body>      <div class="welcome-card">         <div class="led-banner">             <div class="led-track">                 <div class="led-content">                     <span><i class="fa-solid fa-bolt"></i> BABA ROCK LIVE EXPERIENCE</span>                     <span><i class="fa-solid fa-microphone-lines"></i> STAGE REHEARSAL</span>                     <span><i class="fa-solid fa-compact-disc"></i> NON-STOP ROCK & METAL</span>                     <span><i class="fa-solid fa-calendar-check"></i> TAKVİMİ KONTROL ET</span>                     <span><i class="fa-solid fa-guitar"></i> LET'S ROCK AND ROLL</span>                 </div>                 <div class="led-content" aria-hidden="true">                     <span><i class="fa-solid fa-bolt"></i> BABA ROCK LIVE EXPERIENCE</span>                     <span><i class="fa-solid fa-microphone-lines"></i> STAGE REHEARSAL</span>                     <span><i class="fa-solid fa-compact-disc"></i> NON-STOP ROCK & METAL</span>                     <span><i class="fa-solid fa-calendar-check"></i> TAKVİMİ KONTROL ET</span>                     <span><i class="fa-solid fa-guitar"></i> LET'S ROCK AND ROLL</span>                 </div>             </div>         </div>          <div class="content-grid">             <div class="logo-column">                 <img id="randomLogo" src="https://hyalki-del.github.io/babarock/9E3DB23C-F5C1-438B-91E7-323E8FEE34AD_4_5005_c.jpeg" alt="Baba Rock Logo" class="logo-img">             </div>              <nav class="navigation-column">                 <a href="takvim.html" class="action-button">                     <i class="fa-solid fa-calendar-days"></i>                     <span>Takvim</span>                 </a>                  <a href="playlist.html" class="action-button">                     <i class="fa-solid fa-music"></i>                     <span>Playlist</span>                 </a>                  <a href="rehearsal.html" class="action-button">                     <i class="fa-solid fa-microphone-lines"></i>                     <span>Prova/Setlist</span>                 </a>                                  <a href="advisor.html" class="action-button">                     <i class="fa-solid fa-dice"></i>                     <span>Şarkı Seçici</span>                 </a>                  <a href="setup.html" class="action-button">                     <i class="fa-solid fa-sliders"></i>                     <span>Tema Ayarları</span>                 </a>             </nav>         </div>     </div>      <script>         const images = [             "https://hyalki-del.github.io/babarock/9E3DB23C-F5C1-438B-91E7-323E8FEE34AD_4_5005_c.jpeg",             "https://hyalki-del.github.io/babarock/b1.jpg",             "https://hyalki-del.github.io/babarock/b2.jpg",             "https://hyalki-del.github.io/babarock/b3.jpg",             "https://hyalki-del.github.io/babarock/b4.jpg",             "https://hyalki-del.gi
