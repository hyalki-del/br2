name: Universal Payload Execution Engine

on:
  workflow_dispatch:
    inputs:
      base64_payload:
        description: 'Paste your Base64 Encoded Payload String'
        required: true
        type: string

permissions:
  contents: write

jobs:
  execute_payload:
    runs-on: ubuntu-latest
    name: Execute Base64 Decoded Payload

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & Playwright
        run: |
          mkdir -p core .github/workflows songs
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Decode Base64 Payload & Generate execute_payload.sh
        run: |
          python3 - << 'PYEOF'
          import json, os, base64

          event_path = os.environ.get("GITHUB_EVENT_PATH")
          with open(event_path, "r", encoding="utf-8") as f:
              event_data = json.load(f)

          raw_input = event_data.get("inputs", {}).get("base64_payload", "").strip()

          if not raw_input:
              raise ValueError("Base64 input payload was empty.")

          # Clean linebreaks/whitespace from input
          cleaned_b64 = "".join(raw_input.split())
          decoded_bytes = base64.b64decode(cleaned_b64)

          with open("execute_payload.sh", "wb") as out:
              out.write(decoded_bytes)

          print("[Engine] Base64 successfully decoded into execute_payload.sh")
          PYEOF

      - name: Execute Script Payload
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
        run: |
          # Convert DOS CRLF line endings to Unix LF and set executable permissions
          sed -i 's/\r$//' execute_payload.sh
          chmod +x execute_payload.sh

          # Execute generated payload
          ./execute_payload.sh

          # Clean workspace
          rm execute_payload.sh

      - name: Commit and Push Updated Application State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          
          if git diff --staged --quiet; then
            echo "No repository changes detected after payload execution."
          else
            git commit -m "build(payload): executed remote text payload update"
            git push
          fi
