 <!DOCTYPE html> <html lang="tr"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">     <title>Baba Rock - Etkinlik Takvimi</title>     <script>         (function() {             const savedTheme = localStorage.getItem('babarock_theme') || 'apple';             document.documentElement.setAttribute('data-theme', savedTheme);         })();     </script>     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">     <link rel="preconnect" href="https://fonts.googleapis.com">     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>     <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">          <link rel="stylesheet" href="./css/core.css?v=BUILD_SHA">     <link rel="stylesheet" href="./css/theme-apple.css?v=BUILD_SHA">     <link rel="stylesheet" href="./css/theme-marvel.css?v=BUILD_SHA">     <link rel="stylesheet" href="./css/theme-wb.css?v=BUILD_SHA">          <style>         .calendar-card {             width: 100%;             max-width: 520px;             padding: 24px;             background: var(--card-bg, rgba(18, 18, 18, 0.90));             border: var(--card-border, 1px solid rgba(255, 255, 255, 0.15));             border-radius: 20px;             box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);             backdrop-filter: blur(12px);             -webkit-backdrop-filter: blur(12px);             display: flex;             flex-direction: column;             gap: 16px;         }         .calendar-header {             display: flex;             justify-content: space-between;             align-items: center;             color: var(--app-text, #fff);         }         .calendar-header h2 {             font-size: 1.25rem;             font-weight: 700;             color: var(--accent-color, #ff4500);         }         .nav-arrow-btn {             background: rgba(255, 255, 255, 0.08);             border: 1px solid rgba(255, 255, 255, 0.2);             color: #fff;             padding: 8px 14px;             border-radius: 8px;             cursor: pointer;             font-weight: bold;             transition: background 0.2s;         }         .nav-arrow-btn:hover {             background: var(--accent-color, #ff4500);             color: #000;         }         .weekdays-grid {             display: grid;             grid-template-columns: repeat(7, 1fr);             text-align: center;             font-size: 0.8rem;             font-weight: 700;             color: #aaa;             padding-bottom: 4px;         }         .days-grid {             display: grid;             grid-template-columns: repeat(7, 1fr);             gap: 6px;         }         .day-cell {             aspect-ratio: 1;             background: #2e7d32; /* Default Green for Free */             border-radius: 8px;             display: flex;             flex-direction: column;             align-items: center;             justify-content: center;             font-size: 0.9rem;             font-weight: 700;             color: #fff;             cursor: pointer;             user-select: none;             transition: transform 0.1s ease, filter 0.2s ease;             position: relative;             padding: 2px;         }         .day-cell:active {             transform: scale(0.92);         }         .day-cell.empty {             background: transparent;             cursor: default;             pointer-events: none;         }         .day-cell.busy {             background: #c62828; /* Red for Busy */         }         .busy-initials {             font-size: 0.65rem;             letter-spacing: 1px;             margin-top: 2px;             background: rgba(0, 0, 0, 0.4);             padding: 1px 4px;             border-radius: 4px;         }         .member-selector-bar {             display: flex;             gap: 8px;             align-items: center;             justify-content: center;             font-size: 0.85rem;             background: rgba(0,0,0,0.3);             padding: 10px;             border-radius: 10px;             border: 1px solid rgba(255,255,255,0.1);         }         .member-selector-bar select {             background: #111;             color: #fff;             border: 1px solid var(--accent-color, #ff4500);             padding: 6px 10px;             border-radius: 6px;             outline: none;             font-weight: 600;         }         .back-nav-container {             display: flex;             justify-content: space-between;             align-items: center;             border-top: 1px solid rgba(255,255,255,0.1);             padding-top: 12px;         }         .btn-back {             padding: 8px 16px;             background: rgba(255, 255, 255, 0.08);             color: #fff;             text-decoration: none;             border-radius: 8px;             font-weight: 700;             font-size: 0.85rem;         }         .btn-back:hover {             background: var(--accent-color, #ff4500);             color: #000;         }     </style> </head> <body>      <div class="bg-container">         <img id="fullBgImage" alt="Background" class="bg-image">     </div>      <div class="dotted-overlay"></div>      <div class="led-banner-container">         <div class="led-track">             <div class="led-content">                 <span><i class="fa-solid fa-calendar-days"></i> ETKİNLİK & PROVA TAKVİMİ</span>                 <span><i class="fa-solid fa-circle-check"></i> YEŞİL = MÜSAİT</span>                 <span><i class="fa-solid fa-circle-xmark"></i> KIRMIZI = MEŞGUL</span>                 <span><i class="fa-solid fa-users"></i> ÜYE DURUMUNU GÜNCELLE</span>             </div>             <div class="led-content" aria-hidden="true">                 <span><i class="fa-solid fa-calendar-days"></i> ETKİNLİK & PROVA TAKVİMİ</span>                 <span><i class="fa-solid fa-circle-check"></i> YEŞİL = MÜSAİT</span>                 <span><i class="fa-solid fa-circle-xmark"></i> KIRMIZI = MEŞGUL</span>                 <span><i class="fa-solid fa-users"></i> ÜYE DURUMUNU GÜNCELLE</span>             </div>         </div>     </div>      <main class="main-wrapper">         <div class="calendar-card">                          <div class="member-selector-bar">                 <label for="activeMember"><i class="fa-solid fa-user-tag"></i> Aktif Üye:</label>                 <select id="activeMember">                     <option value="V">Vocal (V)</option>                     <option value="G">Guitar (G)</option>                     <option value="B">Bass (B)</option>                     <option value="D">Drums (D)</option>                 </select>             </div>              <div class="calendar-header">                 <button class="nav-arrow-btn" id="prevMonthBtn"><i class="fa-solid fa-chevron-left"></i></button>                 <h2 id="monthYearDisplay">Yükleniyor...</h2>                 <button class="nav-arrow-btn" id="nextMonthBtn"><i class="fa-solid fa-chevron-right"></i></button>             </div>              <div class="weekdays-grid">                 <div>Pzt</div><div>Sal</div><div>Çar</div><div>Per</div><div>Cum</div><div>Cmt</div><div>Paz</div>             </div>              <div class="days-grid" id="daysGrid">                 </div>              <div class="back-nav-container">                 <a href="./index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Ana Sayfa</a>                 <span style="font-size: 0.75rem; color: #888;">Değişiklikleri kaydetmek için update.yml kullanın</span>             </div>         </div>     </main>      <script>         let currentDate = new Date();         let calendarData = {};          const monthNames = [             "Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran",              "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"         ];          async function fetchCalendarData() {             try {                 const res = await fetch('./calendar.json?v=' + Date.now());                 if (res.ok) {                     calendarData = await res.json();                 }             } catch (e) {                 console.log('No existing calendar data found, starting fresh.');             }             renderCalendar();         }          function renderCalendar() {             const year = currentDate.getFullYear();             const month = currentDate.getMonth();              document.getElementById('monthYearDisplay').innerText = `${monthNames[month]} ${year}`;              const grid = document.getElementById('daysGrid');             grid.innerHTML = '';              // Get first day of month (Adjusted Monday start: 0 = Mon, 6 = Sun)             let firstDayIndex = new Date(year, month, 1).getDay();             firstDayIndex = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;              const totalDays = new Date(year, month + 1, 0).getDate();              // Empty padding slots before first day             for (let i = 0; i < firstDayIndex; i++) {                 const emptyCell = document.createElement('div');                 emptyCell.className = 'day-cell empty';                 grid.appendChild(emptyCell);             }              // Populate days of the month             for (let day = 1; day <= totalDays; day++) {                 const cell = document.createElement('div');                 cell.className = 'day-cell';                  const mm = String(month + 1).padStart(2, '0');                 const dd = String(day).padStart(2, '0');                 const dateKey = `${year}-${mm}-${dd}`;                  const busyList = calendarData[dateKey] || [];                 const isBusy = busyList.length > 0;                  if (isBusy) {                     cell.classList.add('busy');                 }                  const dayNumberSpan = document.createElement('span');                 dayNumberSpan.innerText = day;                 cell.appendChild(dayNumberSpan);                  if (isBusy) {                     const badge = document.createElement('span');                     badge.className = 'busy-initials';                     badge.innerText = busyList.join('');                     cell.appendChild(badge);                 }                  // Toggle busy state on click for selected active member                 cell.addEventListener('click', () => {                     const memberInitial = document.getElementById('activeMember').value;                     if (!calendarData[dateKey]) {                         calendarData[dateKey] = [];                     }                      const index = calendarData[dateKey].indexOf(memberInitial);                     if (index > -1) {                         calendarData[dateKey].splice(index, 1); // Remove busy status                         if (calendarData[dateKey].length === 0) {                             delete calendarData[dateKey];                         }                     } else {                         calendarData[dateKey].push(memberInitial); // Add busy status                     }                     renderCalendar();                                          // Note since there is no local storage, output updated JSON to console for git repo update                     console.log("Updated calendar.json state for git commit:", JSON.stringify(calendarData, null, 2));                 });                  grid.appendChild(cell);             }         }          document.getElementById('prevMonthBtn').addEventListener('click', () => {             currentDate.setMonth(currentDate.getMonth() - 1);             renderCalendar();         });          document.getElementById('nextMonthBtn').addEventListener('click', () => {             currentDate.setMonth(currentDate.getMonth() + 1);             renderCalendar();         });          fetchCalendarData();     </script>      <script src="./js/setup.js?v=BUILD_SHA"></script>     <script src="./js/script.js?v=BUILD_SHA"></script> </body> </html>
