<!DOCTYPE html> <html lang="en"> <head>     <meta charset="UTF-8">     <title>Band Dashboard</title>     <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">     <style>         * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s; }         body { background-color: var(--bg-primary, #f5f5f7); color: var(--text-main, #1d1d1f); font-family: var(--font-family, sans-serif); min-height: 100vh; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }         .container { width: 100%; max-width: 900px; }         .hero-banner { background-color: var(--bg-secondary, #ffffff); border: 1px solid var(--border-color, #d2d2d7); border-radius: var(--card-radius, 16px); padding: 40px; text-align: center; box-shadow: var(--box-shadow, none); margin-bottom: 32px; }         h1.band-title { font-size: 3rem; text-transform: var(--header-transform, none); margin-bottom: 12px; }         p.band-members { color: var(--text-muted, #86868b); font-size: 1.1rem; margin-bottom: 24px; }         .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }         .nav-card { background-color: var(--bg-secondary, #ffffff); border: 1px solid var(--border-color, #d2d2d7); border-radius: var(--card-radius, 12px); padding: 24px; text-align: center; text-decoration: none; color: var(--text-main, #1d1d1f); box-shadow: var(--box-shadow, none); transition: transform 0.2s, border-color 0.2s; display: flex; flex-direction: column; align-items: center; }         .nav-card:hover { transform: translateY(-4px); border-color: var(--accent-color, #0071e3); }         .nav-icon { font-size: 2rem; margin-bottom: 12px; }         .nav-title { font-size: 1.2rem; font-weight: 700; text-transform: var(--header-transform, none); margin-bottom: 6px; }         .nav-desc { font-size: 0.825rem; color: var(--text-muted, #86868b); }     </style> </head> <body> <div class="container">     <div class="hero-banner">         <h1 class="band-title" id="bandNameDisplay">Band Dashboard</h1>         <p class="band-members" id="bandMembersDisplay">Loading band lineup...</p>     </div>     <div class="nav-grid">         <a href="playlist.html" class="nav-card"><div class="nav-icon">🎵</div><div class="nav-title">Playlist</div><div class="nav-desc">Setlist, order, key editor & lyrics</div></a>         <a href="setup.html" class="nav-card"><div class="nav-icon">🎨</div><div class="nav-title">Theme Setup</div><div class="nav-desc">Switch design tokens: Hero, Base, Rams</div></a>         <a href="admin.html" class="nav-card"><div class="nav-icon">⚙️</div><div class="nav-title">Admin Panel</div><div class="nav-desc">Generate config.json</div></a>         <a href="takvim.html" class="nav-card"><div class="nav-icon">📅</div><div class="nav-title">Calendar</div><div class="nav-desc">Gig schedules</div></a>         <a href="rehearsal.html" class="nav-card"><div class="nav-icon">🎸</div><div class="nav-title">Rehearsal</div><div class="nav-desc">Practice logs</div></a>         <a href="advisor.html" class="nav-card"><div class="nav-icon">🧠</div><div class="nav-title">Advisor</div><div class="nav-desc">Setlist analytics</div></a>         <a href="fans.html" class="nav-card"><div class="nav-icon">🙌</div><div class="nav-title">Fans</div><div class="nav-desc">Audience list</div></a>     </div> </div> <script src="core/app.js"></script> <script>     document.addEventListener("DOMContentLoaded", () => {         setTimeout(() => {             if (window.BandApp && window.BandApp.config) {                 const conf = window.BandApp.config;                 if (conf.band_name) document.getElementById("bandNameDisplay").innerText = conf.band_name;                 if (conf.band_members) document.getElementById("bandMembersDisplay").innerText = conf.band_members.join(" • ");             }         }, 150);     }); </script> </body> </html>
