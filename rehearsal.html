 <!DOCTYPE html> <html lang="en"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">     <title>Baba Rock - Prova/Setlist</title>     <script>         (function() {             const savedTheme = localStorage.getItem('babarock_theme') || 'default';             document.documentElement.setAttribute('data-theme', savedTheme);         })();     </script>     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">     <link rel="stylesheet" href="css/core.css?v=BUILD_SHA">     <link rel="stylesheet" href="css/theme-apple.css?v=BUILD_SHA">     <link rel="stylesheet" href="css/theme-marvel.css?v=BUILD_SHA">     <link rel="stylesheet" href="css/theme-wb.css?v=BUILD_SHA">     <style>         .page-card {             max-width: 540px;             width: 100%;             padding: 24px;             background: rgba(18, 18, 18, 0.92);             border: 1px solid var(--hex-border);             border-radius: 20px;             box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);             backdrop-filter: blur(12px);             -webkit-backdrop-filter: blur(12px);             display: flex;             flex-direction: column;             gap: 16px;         }         .header-nav {             display: flex;             justify-content: space-between;             align-items: center;             border-bottom: 1px solid rgba(255, 255, 255, 0.15);             padding-bottom: 12px;         }         .btn-back {             padding: 8px 16px;             background: var(--hex-border);             color: #fff;             text-decoration: none;             border-radius: 8px;             font-weight: 700;             font-size: 0.85rem;         }         .setlist-container {             display: flex;             flex-direction: column;             gap: 10px;             max-height: 60vh;             overflow-y: auto;             padding-right: 4px;         }         .setlist-item {             background: rgba(255, 255, 255, 0.05);             border: 1px solid rgba(255, 255, 255, 0.12);             border-radius: 10px;             padding: 12px 16px;             display: flex;             justify-content: space-between;             align-items: center;             cursor: pointer;             user-select: none;             transition: all 0.2s ease;         }         .setlist-item.done {             opacity: 0.4;             text-decoration: line-through;             border-left: 4px solid #4caf50;         }         .song-title {             font-weight: 700;             font-size: 1rem;             color: #fff;         }         .song-artist {             font-size: 0.8rem;             color: #aaa;         }         .check-icon {             font-size: 1.2rem;             color: var(--hex-icon);         }     </style> </head> <body>     <div class="bg-container">         <img id="fullBgImage" src="https://hyalki-del.github.io/babarock/9E3DB23C-F5C1-438B-91E7-323E8FEE34AD_4_5005_c.jpeg" alt="Background" class="bg-image">     </div>     <div class="dotted-overlay"></div>     <main class="main-wrapper" style="margin-top: 20px;">         <div class="page-card">             <div class="header-nav">                 <h2><i class="fa-solid fa-microphone-lines"></i> Prova / Setlist Takibi</h2>                 <a href="index.html" class="btn-back">Geri</a>             </div>             <p style="font-size: 0.85rem; color: #aaa;">Tamamlanan şarkıların üzerine tıklayarak işaretleyebilirsiniz.</p>             <div id="setlistContainer" class="setlist-container">                 <p style="color: #888; text-align: center;">Setlist yükleniyor...</p>             </div>         </div>     </main>     <script>         fetch('songs.json?v=' + Date.now())             .then(res => res.json())             .then(songs => {                 const container = document.getElementById('setlistContainer');                 if (!songs || songs.length === 0) {                     container.innerHTML = '<p style="color:#aaa; text-align:center;">Setlist boş.</p>';                     return;                 }                 container.innerHTML = songs.map((song, idx) => `                     <div class="setlist-item" onclick="this.classList.toggle('done')">                         <div>                             <div class="song-title">${idx + 1}. ${song.title}</div>                             <div class="song-artist">${song.artist}</div>                         </div>                         <i class="fa-regular fa-circle-check check-icon"></i>                     </div>                 `).join('');             })             .catch(err => {                 console.error(err);                 document.getElementById('setlistContainer').innerHTML = '<p style="color:#ff4444; text-align:center;">Setlist yüklenemedi.</p>';             });     </script>     <script src="js/setup.js?v=BUILD_SHA"></script>     <script src="js/script.js?v=BUILD_SHA"></script> </body> </html>
