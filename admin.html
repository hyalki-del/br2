<!DOCTYPE html> <html lang="en"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0">     <title>Admin Panel — Band Dashboard</title>     <style>         :root { --bg-color: #0d1117; --card-bg: #161b22; --border-color: #30363d; --text-main: #c9d1d9; --accent-color: #238636; --accent-secondary: #1f6feb; --input-bg: #010409; }         * { box-sizing: border-box; margin: 0; padding: 0; }         body { background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }         .admin-container { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; width: 100%; max-width: 650px; padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }         h2 { margin-bottom: 24px; font-size: 1.5rem; color: #fff; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }         .form-group { margin-bottom: 20px; }         label { display: block; font-size: 0.875rem; margin-bottom: 8px; font-weight: 600; color: #8b949e; }         input[type="text"], input[type="url"], input[type="file"] { width: 100%; padding: 10px; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 0.95rem; }         input[type="file"] { padding: 8px; cursor: pointer; }         .file-hint { font-size: 0.75rem; color: #8b949e; margin-top: 4px; }                  .button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }         .btn { padding: 12px; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.95rem; transition: opacity 0.2s; text-align: center; }         .btn:hover { opacity: 0.9; }         .btn-download { background-color: var(--accent-secondary); }         .btn-save-cloud { background-color: var(--accent-color); }         .btn-photo-only { background-color: #8957e5; grid-column: span 2; }                  .status-msg { margin-top: 16px; padding: 10px; border-radius: 6px; font-size: 0.875rem; text-align: center; display: none; }         .status-success { background: rgba(35, 134, 54, 0.2); border: 1px solid rgba(35, 134, 54, 0.4); color: #3fb950; }         .status-error { background: rgba(248, 81, 73, 0.2); border: 1px solid rgba(248, 81, 73, 0.4); color: #f85149; }     </style> </head> <body> <div class="admin-container">     <h2>Band Dashboard Administration</h2>     <form id="configForm">         <div class="form-group">             <label>Band Name</label>             <input type="text" id="bandName" required placeholder="e.g. The Midnight Echo">         </div>         <div class="form-group">             <label>Band Members (Comma Separated)</label>             <input type="text" id="bandMembers" required placeholder="Alex, Jordan, Taylor">         </div>         <div class="form-group">             <label>Google Apps Script Web App URL <span style="font-weight:normal; color:#3fb950;">(Auto-loaded from config.json)</span></label>             <input type="url" id="googleSheetsApiUrl" placeholder="https://script.google.com/macros/s/.../exec">         </div>         <div class="form-group">             <label>Ultimate Guitar Playlist Link</label>             <input type="url" id="ugPlaylistLink" required placeholder="https://www.ultimate-guitar.com/user/playlist/...">         </div>         <div class="form-group">             <label>Band Photos (Saved to root /img folder & Sheets band-info)</label>             <input type="file" id="bandPhotosInput" accept="image/*" multiple>             <div class="file-hint">Select images to upload. Uses pre-configured Google Sheets URL automatically.</div>         </div>          <div class="button-grid">             <button type="button" class="btn btn-download" onclick="downloadConfigJson()">📥 Create .json & Download</button>             <button type="button" class="btn btn-save-cloud" onclick="saveInfoToCloud()">☁️ Save Updated Info</button>             <button type="button" class="btn btn-photo-only" onclick="uploadPhotosOnly()">📸 Upload Photos to /img & Sheets</button>         </div>          <div id="statusMessage" class="status-msg"></div>     </form> </div>  <script>     let loadedConfig = {};      document.addEventListener("DOMContentLoaded", async () => {         try {             const res = await fetch("config.json");             if (res.ok) {                 loadedConfig = await res.json();                 if (loadedConfig.band_name) document.getElementById("bandName").value = loadedConfig.band_name;                 if (loadedConfig.band_members) document.getElementById("bandMembers").value = Array.isArray(loadedConfig.band_members) ? loadedConfig.band_members.join(", ") : loadedConfig.band_members;                 if (loadedConfig.google_sheets_api_url) document.getElementById("googleSheetsApiUrl").value = loadedConfig.google_sheets_api_url;                 if (loadedConfig.ug_playlist_link) document.getElementById("ugPlaylistLink").value = loadedConfig.ug_playlist_link;             }         } catch (e) {}     });      // Helper to resolve URL from input field or fallback config.json without errors     function resolveApiUrl() {         const inputVal = document.getElementById('googleSheetsApiUrl').value.trim();         if (inputVal) return inputVal;         if (loadedConfig && loadedConfig.google_sheets_api_url) return loadedConfig.google_sheets_api_url;         return "";     }      async function getFormDataPayload() {         const fileInput = document.getElementById('bandPhotosInput');         let photoPaths = loadedConfig.band_photos || [];          if (fileInput.files && fileInput.files.length > 0) {             for (let file of fileInput.files) {                 const pathStr = `img/${file.name}`;                 if (!photoPaths.includes(pathStr)) {                     photoPaths.push(pathStr);                 }             }         }          const apiUrl = resolveApiUrl();          return {             band_name: document.getElementById('bandName').value.trim() || loadedConfig.band_name || "",             band_members: document.getElementById('bandMembers').value ? document.getElementById('bandMembers').value.split(',').map(m => m.trim()) : (loadedConfig.band_members || []),             google_sheets_api_url: apiUrl,             ug_playlist_link: document.getElementById('ugPlaylistLink').value.trim() || loadedConfig.ug_playlist_link || "",             band_photos: photoPaths,             active_theme: loadedConfig.active_theme || "base",             created_at: loadedConfig.created_at || new Date().toISOString()         };     }      async function downloadConfigJson() {         const data = await getFormDataPayload();         const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });         const a = document.createElement('a');         a.href = URL.createObjectURL(blob);         a.download = 'config.json';         a.click();         showStatus("config.json successfully generated and downloaded.", "success");     }      async function saveInfoToCloud() {         const data = await getFormDataPayload();         if (!data.google_sheets_api_url) {             showStatus("Google Apps Script URL is required.", "error");             return;         }          try {             showStatus("Saving info to Google Sheets band-info tab...", "success");             const res = await fetch(data.google_sheets_api_url, {                 method: "POST",                 headers: { "Content-Type": "text/plain;charset=utf-8" },                 body: JSON.stringify({ action: "updateBandInfo", payload: data })             });             const json = await res.json();             if (json.status === "success" || res.ok) {                 showStatus("Successfully updated band-info tab in Google Sheets!", "success");             } else {                 showStatus("Failed to update cloud.", "error");             }         } catch (e) {             showStatus("Network error: " + e.message, "error");         }     }      async function uploadPhotosOnly() {         const apiUrl = resolveApiUrl();         const fileInput = document.getElementById('bandPhotosInput');                  if (!apiUrl) {             showStatus("Google Apps Script URL is missing from both input and config.json.", "error");             return;         }         if (!fileInput.files || fileInput.files.length === 0) {             showStatus("Please select at least one photo to upload.", "error");             return;         }          let photoPayloads = [];         for (let file of fileInput.files) {             const base64 = await toBase64(file);             photoPayloads.push({ name: file.name, data: base64, path: `img/${file.name}` });         }          try {             showStatus("Uploading photos to cloud and registering in Sheets...", "success");             const res = await fetch(apiUrl, {                 method: "POST",                 headers: { "Content-Type": "text/plain;charset=utf-8" },                 body: JSON.stringify({ action: "uploadBandPhotos", payload: { photos: photoPayloads } })             });             const json = await res.json();             if (json.status === "success" || res.ok) {                 showStatus("Photos successfully uploaded and recorded in band-info!", "success");             } else {                 showStatus("Photo upload failed.", "error");             }         } catch (e) {             showStatus("Network error during photo upload: " + e.message, "error");         }     }      const toBase64 = file => new Promise((resolve, reject) => {         const reader = new FileReader();         reader.readAsDataURL(file);         reader.onload = () => resolve(reader.result);         reader.onerror = error => reject(error);     });      function showStatus(msg, type) {         const el = document.getElementById("statusMessage");         el.innerText = msg;         el.className = `status-msg status-${type}`;         el.style.display = "block";         setTimeout(() => { el.style.display = "none"; }, 5000);     } </script> </body> </html>
