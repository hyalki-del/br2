name: Universal Payload Execution Engine

on:
  workflow_dispatch:
    inputs:
      code_payload:
        description: 'Paste your raw text payload here'
        required: true
        type: string

permissions:
  contents: write

jobs:
  execute_payload:
    runs-on: ubuntu-latest
    name: Execute Unpacked Payload

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & Playwright
        run: |
          mkdir -p core .github/workflows songs
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Parse and Unpack Files
        env:
          RAW_PAYLOAD: ${{ inputs.code_payload }}
        run: |
          python3 - << 'PYEOF'
          import os, re

          payload = os.environ.get("RAW_PAYLOAD", "").strip()
          if not payload:
              raise ValueError("Payload input was empty.")

          # Split files by divider: === FILE: path/filename ===
          pattern = r"^===\s*FILE:\s*(.*?)\s*===$"
          parts = re.split(pattern, payload, flags=re.MULTILINE)

          if len(parts) < 3:
              raise ValueError("Invalid format. Use '=== FILE: filepath ===' headers.")

          for i in range(1, len(parts), 2):
              filepath = parts[i].strip()
              content = parts[i+1]

              # Ensure parent directories exist
              dirpath = os.path.dirname(filepath)
              if dirpath:
                  os.makedirs(dirpath, exist_ok=True)

              with open(filepath, "w", encoding="utf-8") as f:
                  f.write(content.strip() + "\n")
              print(f"[Engine] Written: {filepath}")
          PYEOF

      - name: Execute Automated Scraper & Lyrics Engine
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
        run: |
          if [ -f "scraper.py" ]; then
            python3 scraper.py
          fi

      - name: Commit and Push Updated Application State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          
          if git diff --staged --quiet; then
            echo "No repository changes detected after payload execution."
          else
            git commit -m "build(payload): executed remote text payload update"
            git push
          fi
