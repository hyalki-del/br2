 <!DOCTYPE html> <html lang="en"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">     <title>Baba Rock - Playlist</title>     <script>         (function() {             const savedTheme = localStorage.getItem('babarock_theme') || 'default';             document.documentElement.setAttribute('data-theme', savedTheme);         })();     </script>     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">     <link rel="stylesheet" href="css/core.css?v=BUILD_SHA">     <link rel="stylesheet" href="css/theme-apple.css?v=BUILD_SHA">     <link rel="stylesheet" href="css/theme-marvel.css?v=BUILD_SHA">     <link rel="stylesheet" href="css/theme-wb.css?v=BUILD_SHA">     <style>         .page-card {             max-width: 540px;             width: 100%;             padding: 24px;             background: rgba(18, 18, 18, 0.92);             border: 1px solid var(--hex-border);             border-radius: 20px;             box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);             backdrop-filter: blur(12px);             -webkit-backdrop-filter: blur(12px);             display: flex;             flex-direction: column;             gap: 16px;         }         .header-nav {             display: flex;             justify-content: space-between;             align-items: center;             border-bottom: 1px solid rgba(255, 255, 255, 0.15);             padding-bottom: 12px;         }         .header-nav h2 {             font-size: 1.4rem;             color: #fff;             display: flex;             align-items: center;             gap: 10px;         }         .btn-back {             padding: 8px 16px;             background: var(--hex-border);             color: #fff;             text-decoration: none;             border-radius: 8px;             font-weight: 700;             font-size: 0.85rem;         }         .search-box {             width: 100%;             padding: 12px;             border-radius: 10px;             background: #111;             border: 1px solid var(--hex-border);             color: #fff;             font-size: 0.95rem;             outline: none;         }         .song-list {             display: flex;             flex-direction: column;             gap: 12px;             max-height: 58vh;             overflow-y: auto;             padding-right: 4px;         }         .song-item {             background: rgba(255, 255, 255, 0.05);             border: 1px solid rgba(255, 255, 255, 0.12);             border-left: 4px solid var(--hex-border);             border-radius: 10px;             padding: 14px;             display: flex;             justify-content: space-between;             align-items: center;             text-decoration: none;             color: inherit;             transition: background 0.2s ease;         }         .song-item:hover {             background: rgba(255, 255, 255, 0.12);         }         .song-info {             display: flex;             flex-direction: column;             gap: 4px;         }         .song-title {             font-size: 1.05rem;             font-weight: 700;             color: #ffffff;         }         .song-artist {             font-size: 0.85rem;             color: #bbb;         }         .song-meta {             display: flex;             align-items: center;             gap: 8px;             font-size: 0.75rem;             color: var(--hex-icon);         }         .badge {             padding: 3px 8px;             border-radius: 4px;             font-size: 0.7rem;             background: rgba(255, 255, 255, 0.1);             color: #fff;         }     </style> </head> <body>     <div class="bg-container">         <img id="fullBgImage" src="https://hyalki-del.github.io/babarock/9E3DB23C-F5C1-438B-91E7-323E8FEE34AD_4_5005_c.jpeg" alt="Background" class="bg-image">     </div>     <div class="dotted-overlay"></div>     <main class="main-wrapper" style="margin-top: 20px;">         <div class="page-card">             <div class="header-nav">                 <h2><i class="fa-solid fa-music"></i> Şarkı Repertuarı</h2>                 <a href="index.html" class="btn-back">Geri</a>             </div>             <input type="text" id="searchInput" class="search-box" placeholder="Şarkı veya Sanatçı Ara...">             <div id="songContainer" class="song-list">                 <p style="color: #888; text-align: center;">Yükleniyor...</p>             </div>         </div>     </main>     <script>         let allSongs = [];         function renderSongs(songsToRender) {             const container = document.getElementById('songContainer');             if (!songsToRender || songsToRender.length === 0) {                 container.innerHTML = '<p style="color:#aaa; text-align:center;">Şarkı bulunamadı.</p>';                 return;             }             container.innerHTML = songsToRender.map(song => `                 <a href="${song.url || '#'}" target="_blank" rel="noopener" class="song-item">                     <div class="song-info">                         <div class="song-title">${song.title}</div>                         <div class="song-artist">${song.artist}</div>                     </div>                     <div class="song-meta">                         <span class="badge">${song.key || 'Std'}</span>                         <i class="fa-solid fa-arrow-up-right-from-square"></i>                     </div>                 </a>             `).join('');         }         fetch('songs.json?v=' + Date.now())             .then(res => res.json())             .then(data => {                 allSongs = data;                 renderSongs(allSongs);             })             .catch(err => {                 console.error(err);                 document.getElementById('songContainer').innerHTML = '<p style="color:#ff4444; text-align:center;">Şarkı listesi yüklenemedi.</p>';             });         document.getElementById('searchInput').addEventListener('input', (e) => {             const term = e.target.value.toLowerCase();             const filtered = allSongs.filter(s =>                 s.title.toLowerCase().includes(term) ||                 s.artist.toLowerCase().includes(term)             );             renderSongs(filtered);         });     </script>     <script src="js/setup.js?v=BUILD_SHA"></script>     <script src="js/script.js?v=BUILD_SHA"></script> </body> </html>
