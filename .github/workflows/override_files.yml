name: Universal Payload Execution Engine

on:
  workflow_dispatch:
    inputs:
      code_payload:
        description: 'Paste your complete execution text payload here'
        required: true
        type: string

permissions:
  contents: write

jobs:
  execute_payload:
    runs-on: ubuntu-latest
    name: Execute Dynamic File Payload

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python & Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright
        run: |
          mkdir -p core .github/workflows songs
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Safely Write and Execute Payload Script
        env:
          PAYLOAD_TEXT: ${{ inputs.code_payload }}
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
        run: |
          # Use Python to preserve multiline breaks and avoid shell escaping issues
          python3 -c "import os; open('execute_payload.sh', 'w', encoding='utf-8').write(os.environ['PAYLOAD_TEXT'])"
          
          # Convert line endings (DOS/Windows CRLF to Unix LF)
          sed -i 's/\r$//' execute_payload.sh
          
          chmod +x execute_payload.sh
          ./execute_payload.sh
          
          rm execute_payload.sh

      - name: Commit and Push All Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          
          if git diff --staged --quiet; then
            echo "No repository changes detected after payload execution."
          else
            git commit -m "build(payload): executed remote text payload update"
            git push
          fi
