name: Universal Payload Execution Engine

on:
  workflow_dispatch:
    inputs:
      code_payload:
        description: 'Paste plain-text multi-file payload here'
        required: true
        type: string

permissions:
  contents: write

jobs:
  execute_payload:
    runs-on: ubuntu-latest
    name: Unpack and Execute

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & Playwright
        run: |
          mkdir -p core .github/workflows songs
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Parse and Reconstruct Code Files
        env:
          RAW_INPUT: ${{ inputs.code_payload }}
        run: |
          python3 - << 'PYEOF'
          import os, re

          raw_text = os.environ.get("RAW_INPUT", "").strip()
          if not raw_text:
              raise ValueError("Payload input was empty.")

          # Step 1: Normalize all form-encoded newlines and literal \n strings
          normalized = raw_text.replace('\\n', '\n').replace(';; ', '\n').replace(';;', '\n')

          # Step 2: Split by target file headers (=== FILE: path ===)
          pattern = r"===\s*FILE:\s*([^\s=]+(?:\/[^\s=]+)*)\s*==="
          tokens = re.split(pattern, normalized)

          if len(tokens) < 3:
              raise ValueError("No valid '=== FILE: filepath ===' sections were detected.")

          files_written = 0
          for i in range(1, len(tokens), 2):
              filepath = tokens[i].strip()
              content = tokens[i+1]

              if not filepath:
                  continue

              dirpath = os.path.dirname(filepath)
              if dirpath:
                  os.makedirs(dirpath, exist_ok=True)

              with open(filepath, "w", encoding="utf-8", newline="\n") as f:
                  f.write(content.strip() + "\n")

              print(f"[Engine] Successfully wrote: {filepath}")
              files_written += 1

          print(f"[Engine] Unpacking complete. Total files created: {files_written}")
          PYEOF

      - name: Execute Scraper Engine
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
        run: |
          if [ -f "scraper.py" ]; then
            python3 scraper.py
          fi

      - name: Commit and Push Updated Application State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "build(payload): executed universal text payload update"
            git push
          fi
