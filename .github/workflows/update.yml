name: Single Block Repository Updater

on:
  workflow_dispatch:
    inputs:
      code_block:
        description: 'Paste the entire multi-file code block here'
        required: true
        type: string

jobs:
  update-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Parse and Update Files
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const rawInput = context.payload.inputs.code_block;
            
            // Global regex delimiter matching '=== FILE: filename ==='
            const regex = /===\s*FILE:\s*([^\s=]+)\s*===/g;
            let match;
            let fileEntries = [];

            // Extract all file markers and their positions
            while ((match = regex.exec(rawInput)) !== null) {
              fileEntries.push({
                filePath: match[1].trim(),
                headerEnd: regex.lastIndex,
                headerStart: match.index
              });
            }

            if (fileEntries.length === 0) {
              core.setFailed("No valid '=== FILE: filename ===' markers found in input.");
              return;
            }

            // Extract file contents between markers
            for (let i = 0; i < fileEntries.length; i++) {
              const current = fileEntries[i];
              const nextStart = (i + 1 < fileEntries.length) ? fileEntries[i + 1].headerStart : rawInput.length;
              
              let content = rawInput.substring(current.headerEnd, nextStart);

              // Create parent directory if missing
              const dir = path.dirname(current.filePath);
              if (!fs.existsSync(dir)) {
                fs.mkdirSync(dir, { recursive: true });
              }

              fs.writeFileSync(current.filePath, content, 'utf8');
              console.log(`Successfully updated: ${current.filePath}`);
            }

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Bulk update via single block action" || echo "No changes to commit"
          git push
