<!DOCTYPE html> <html lang="en"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0">     <title>Theme Setup — Band Dashboard</title>     <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">     <style>         * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }         body { background-color: var(--bg-primary, #0d1117); color: var(--text-main, #c9d1d9); font-family: var(--font-family, sans-serif); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }         .container { width: 100%; max-width: 550px; background: var(--bg-secondary, #161b22); border: 1px solid var(--border-color, #30363d); border-radius: var(--card-radius, 12px); padding: 40px; box-shadow: var(--box-shadow, none); }         h2 { font-size: 2rem; margin-bottom: 8px; text-transform: var(--header-transform, none); letter-spacing: -0.5px; }         p.subtitle { color: var(--text-muted, #8b949e); font-size: 0.95rem; margin-bottom: 28px; }         .theme-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 32px; }         .theme-btn { padding: 20px; border-radius: 10px; border: 2px solid var(--border-color); background: var(--bg-surface); color: var(--text-main); cursor: pointer; text-align: left; transition: all 0.2s ease; display: flex; flex-direction: column; gap: 6px; }         .theme-btn:hover { border-color: var(--accent-color); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }         .theme-title { font-size: 1.15rem; font-weight: 700; text-transform: var(--header-transform, none); color: #fff; }         .theme-desc { font-size: 0.85rem; color: var(--text-muted, #8b949e); }         .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--accent-color); text-decoration: none; font-weight: 600; font-size: 0.95rem; }         .back-link:hover { text-decoration: underline; }     </style> </head> <body> <div class="container">     <h2>Theme Configuration</h2>     <p class="subtitle">Select your aesthetic design tokens and typographic hierarchy.</p>          <div class="theme-grid">         <button class="theme-btn" type="button" onclick="selectTheme('hero')">             <span class="theme-title">⚡ Hero Theme</span>             <span class="theme-desc">Oswald typography, crimson accents, high-contrast dark backdrop.</span>         </button>         <button class="theme-btn" type="button" onclick="selectTheme('base')">             <span class="theme-title"> Base Theme</span>             <span class="theme-desc">Apple clean aesthetic, system sans-serif, electric blue accents.</span>         </button>         <button class="theme-btn" type="button" onclick="selectTheme('rams')">             <span class="theme-title">📻 Rams Theme</span>             <span class="theme-desc">Braun industrial minimalism, monospace typography, industrial orange.</span>         </button>     </div>      <a href="index.html" class="back-link">← Return to Dashboard</a> </div>  <script src="core/app.js"></script> <script>     function selectTheme(themeKey) {         if (window.BandApp && typeof window.BandApp.saveThemeSelection === 'function') {             window.BandApp.saveThemeSelection(themeKey);             setTimeout(() => { location.href = "index.html"; }, 150);         } else {             localStorage.setItem("band_app_theme", themeKey);             location.href = "index.html";         }     } </script> </body> </html>
