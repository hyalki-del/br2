name: Universal Payload Execution Engine

on:
  workflow_dispatch:
    inputs:
      code_payload:
        description: 'Paste your raw text payload here'
        required: true
        type: string

permissions:
  contents: write

jobs:
  execute_payload:
    runs-on: ubuntu-latest
    name: Execute Unpacked Payload

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & Playwright
        run: |
          mkdir -p core .github/workflows songs
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Parse and Unpack Files (Fault-Tolerant Scanner Engine)
        env:
          RAW_PAYLOAD: ${{ inputs.code_payload }}
        run: |
          python3 - << 'PYEOF'
          import os, re

          payload = os.environ.get("RAW_PAYLOAD", "")
          if not payload.strip():
              raise ValueError("Payload input was empty.")

          # Tokenizing Regex: Matches === FILE: path/to/file === regardless of line breaks or spaces
          # Matches header patterns like: === FILE: core/app.js === or ===FILE:core/app.js===
          pattern = r"===\s*FILE:\s*([^\s=]+(?:\/[^\s=]+)*)\s*==="
          
          tokens = re.split(pattern, payload)
          
          if len(tokens) < 3:
              # Fallback attempt: match looser pattern without strict trailing '==='
              pattern = r"===\s*FILE:\s*([a-zA-Z0-9_\-\.\/]+)"
              tokens = re.split(pattern, payload)

          if len(tokens) < 3:
              raise ValueError("No valid '=== FILE: path ===' sections were detected in payload string.")

          files_written = 0

          # Token list structure after re.split with 1 capturing group:
          # tokens[0] = noise before first header
          # tokens[1] = filepath_1
          # tokens[2] = content_1
          # tokens[3] = filepath_2
          # tokens[4] = content_2 ...
          for i in range(1, len(tokens), 2):
              filepath = tokens[i].strip()
              content = tokens[i+1].lstrip("\r\n")

              if not filepath:
                  continue

              dirpath = os.path.dirname(filepath)
              if dirpath:
                  os.makedirs(dirpath, exist_ok=True)

              with open(filepath, "w", encoding="utf-8") as f:
                  f.write(content.rstrip() + "\n")

              print(f"[Engine] Successfully wrote: {filepath}")
              files_written += 1

          print(f"[Engine] Unpacking complete. Total files created/overridden: {files_written}")
          PYEOF

      - name: Execute Automated Scraper & Lyrics Engine
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
        run: |
          if [ -f "scraper.py" ]; then
            python3 scraper.py
          fi

      - name: Commit and Push Updated Application State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          
          if git diff --staged --quiet; then
            echo "No repository changes detected after payload execution."
          else
            git commit -m "build(payload): executed remote text payload update"
            git push
          fi
