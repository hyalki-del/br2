name: Universal Payload Execution Engine

on:
  workflow_dispatch:
    inputs:
      code_payload:
        description: 'Paste your complete multi-file text payload here'
        required: true
        type: string

permissions:
  contents: write

jobs:
  execute_payload:
    runs-on: ubuntu-latest
    name: Unpack Files and Execute Pipeline

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright Chromium
        run: |
          mkdir -p core .github/workflows songs
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Unpack Raw Payload Files
        env:
          RAW_PAYLOAD: ${{ inputs.code_payload }}
        run: |
          python3 - << 'PYEOF'
          import os, re

          raw_input = os.environ.get("RAW_PAYLOAD", "")
          if not raw_input.strip():
              raise ValueError("Payload input was empty.")

          # Standardize literal newlines and escaped newlines from UI forms
          formatted_text = raw_input.replace('\\n', '\n').replace('\r\n', '\n')

          # Parse blocks using marker delimiter: === FILE: filename ===
          pattern = r"===\s*FILE:\s*([^\s=]+(?:\/[^\s=]+)*)\s*==="
          tokens = re.split(pattern, formatted_text)

          if len(tokens) < 3:
              raise ValueError("No valid '=== FILE: filepath ===' sections detected in payload.")

          files_written = 0
          for i in range(1, len(tokens), 2):
              filepath = tokens[i].strip()
              content = tokens[i+1]

              if not filepath:
                  continue

              dirpath = os.path.dirname(filepath)
              if dirpath:
                  os.makedirs(dirpath, exist_ok=True)

              with open(filepath, "w", encoding="utf-8", newline="\n") as f:
                  f.write(content.strip() + "\n")

              print(f"[Engine] Successfully written: {filepath}")
              files_written += 1

          print(f"[Engine] Unpacking complete. Total files processed: {files_written}")
          PYEOF

      - name: Execute Scraper Engine
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
        run: |
          if [ -f "scraper.py" ]; then
            python3 scraper.py
          fi

      - name: Commit and Push All Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          
          if git diff --staged --quiet; then
            echo "No repository changes detected after payload execution."
          else
            git commit -m "build(payload): automated universal repository sync"
            git push
          fi
