name: Universal Repository Synchronizer & File Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize_root_repository:
    runs-on: ubuntu-latest
    name: Bootstrap and Sync All Root Files & Workflows

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Ensure Directory Structure
        run: |
          mkdir -p core .github/workflows songs

      # =========================================================================
      # 1. GENERATE core/app.js (Central State & Theme Hydration Engine)
      # =========================================================================
      - name: Generate core/app.js
        run: |
          cat << 'EOF' > core/app.js
          /**
           * Band Dashboard — Central Core Engine & Theme Hydrator
           * Controls design tokens (hero, base, rams), local state, and sheet sync.
           */
          (function () {
              'use strict';

              window.BandApp = {
                  config: null,
                  activeTheme: 'base',

                  themes: {
                      hero: {
                          name: "hero",
                          label: "Hero (Cinematic / Marvel Style)",
                          variables: {
                              "--bg-primary": "#0b0e14",
                              "--bg-secondary": "#151922",
                              "--bg-surface": "#1e2430",
                              "--text-main": "#f0f4f8",
                              "--text-muted": "#8a99ad",
                              "--accent-color": "#e63946",
                              "--accent-hover": "#ff4d5a",
                              "--border-color": "#2a3447",
                              "--font-family": "'Oswald', 'Trebuchet MS', sans-serif",
                              "--card-radius": "4px",
                              "--box-shadow": "0 8px 24px rgba(230, 57, 70, 0.25)",
                              "--header-transform": "uppercase"
                          }
                      },
                      base: {
                          name: "base",
                          label: "Base (Apple Designer Style)",
                          variables: {
                              "--bg-primary": "#f5f5f7",
                              "--bg-secondary": "#ffffff",
                              "--bg-surface": "rgba(255, 255, 255, 0.8)",
                              "--text-main": "#1d1d1f",
                              "--text-muted": "#86868b",
                              "--accent-color": "#0071e3",
                              "--accent-hover": "#0077ed",
                              "--border-color": "#d2d2d7",
                              "--font-family": "-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif",
                              "--card-radius": "16px",
                              "--box-shadow": "0 4px 20px rgba(0, 0, 0, 0.08)",
                              "--header-transform": "none"
                          }
                      },
                      rams: {
                          name: "rams",
                          label: "Rams (Dieter Rams / Braun Industrial)",
                          variables: {
                              "--bg-primary": "#e8e6e1",
                              "--bg-secondary": "#dedbce",
                              "--bg-surface": "#f2f0eb",
                              "--text-main": "#1a1a1a",
                              "--text-muted": "#666666",
                              "--accent-color": "#ff4500",
                              "--accent-hover": "#e03e00",
                              "--border-color": "#1a1a1a",
                              "--font-family": "'Courier New', Courier, monospace",
                              "--card-radius": "0px",
                              "--box-shadow": "none",
                              "--header-transform": "uppercase"
                          }
                      }
                  },

                  async init() {
                      console.log("[BandApp] Initializing runtime kernel...");
                      try {
                          const res = await fetch("config.json");
                          if (res.ok) {
                              this.config = await res.json();
                              console.log("[BandApp] Loaded config.json.");
                          }
                      } catch (err) {
                          console.warn("[BandApp] Config fetch error:", err);
                      }

                      const cachedTheme = localStorage.getItem("band_app_theme");
                      const configTheme = this.config ? this.config.active_theme : null;
                      const themeToApply = cachedTheme || configTheme || "base";

                      this.applyTheme(themeToApply);

                      if (this.config && this.config.google_sheets_api_url) {
                          this.fetchRemoteTheme();
                      }
                  },

                  applyTheme(themeKey) {
                      const theme = this.themes[themeKey] || this.themes.base;
                      this.activeTheme = theme.name;
                      localStorage.setItem("band_app_theme", theme.name);

                      const root = document.documentElement;
                      Object.entries(theme.variables).forEach(([prop, val]) => {
                          root.style.setProperty(prop, val);
                      });

                      document.body.setAttribute("data-theme", theme.name);
                  },

                  async saveThemeSelection(themeKey) {
                      this.applyTheme(themeKey);

                      if (!this.config || !this.config.google_sheets_api_url) return;

                      const payload = {
                          action: "updateBandInfo",
                          payload: {
                              BandName: this.config.band_name || "My Band",
                              ActiveTheme: themeKey,
                              LastUpdated: new Date().toISOString()
                          }
                      };

                      try {
                          await fetch(this.config.google_sheets_api_url, {
                              method: "POST",
                              headers: { "Content-Type": "text/plain;charset=utf-8" },
                              body: JSON.stringify(payload)
                          });
                      } catch (err) {
                          console.error("[BandApp] Failed updating remote theme:", err);
                      }
                  },

                  async fetchRemoteTheme() {
                      try {
                          const res = await fetch(`${this.config.google_sheets_api_url}?action=readTab&tab=band-info`);
                          const json = await res.json();
                          if (json.status === "success" && json.data.length > 0) {
                              const remoteTheme = json.data[0].ActiveTheme;
                              if (remoteTheme && this.themes[remoteTheme] && remoteTheme !== this.activeTheme) {
                                  this.applyTheme(remoteTheme);
                              }
                          }
                      } catch (err) {
                          console.warn("[BandApp] Remote theme read error:", err);
                      }
                  }
              };

              document.addEventListener("DOMContentLoaded", () => {
                  window.BandApp.init();
              });
          })();
          EOF

      # =========================================================================
      # 2. GENERATE index.html (Master Landing Page)
      # =========================================================================
      - name: Generate index.html
        run: |
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Band Dashboard</title>
              <link rel="preconnect" href="https://fonts.googleapis.com">
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
              <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
              <style>
                  * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s ease, color 0.3s ease; }
                  body { background-color: var(--bg-primary, #f5f5f7); color: var(--text-main, #1d1d1f); font-family: var(--font-family, sans-serif); min-height: 100vh; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
                  .container { width: 100%; max-width: 900px; }
                  .hero-banner { background-color: var(--bg-secondary, #ffffff); border: 1px solid var(--border-color, #d2d2d7); border-radius: var(--card-radius, 16px); padding: 40px; text-align: center; box-shadow: var(--box-shadow, none); margin-bottom: 32px; }
                  h1.band-title { font-size: 3rem; text-transform: var(--header-transform, none); margin-bottom: 12px; }
                  p.band-members { color: var(--text-muted, #86868b); font-size: 1.1rem; margin-bottom: 24px; }
                  .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
                  .nav-card { background-color: var(--bg-secondary, #ffffff); border: 1px solid var(--border-color, #d2d2d7); border-radius: var(--card-radius, 12px); padding: 24px; text-align: center; text-decoration: none; color: var(--text-main, #1d1d1f); box-shadow: var(--box-shadow, none); transition: transform 0.2s ease, border-color 0.2s ease; display: flex; flex-direction: column; justify-content: center; align-items: center; }
                  .nav-card:hover { transform: translateY(-4px); border-color: var(--accent-color, #0071e3); }
                  .nav-icon { font-size: 2rem; margin-bottom: 12px; }
                  .nav-title { font-size: 1.2rem; font-weight: 700; text-transform: var(--header-transform, none); margin-bottom: 6px; }
                  .nav-desc { font-size: 0.825rem; color: var(--text-muted, #86868b); }
              </style>
          </head>
          <body>
          <div class="container">
              <div class="hero-banner">
                  <h1 class="band-title" id="bandNameDisplay">Band Dashboard</h1>
                  <p class="band-members" id="bandMembersDisplay">Loading band lineup...</p>
              </div>
              <div class="nav-grid">
                  <a href="playlist.html" class="nav-card">
                      <div class="nav-icon">🎵</div>
                      <div class="nav-title">Playlist</div>
                      <div class="nav-desc">Setlist, drag-and-drop order, key editor, and lyrics</div>
                  </a>
                  <a href="setup.html" class="nav-card">
                      <div class="nav-icon">🎨</div>
                      <div class="nav-title">Theme Setup</div>
                      <div class="nav-desc">Switch design tokens: Hero, Base, or Rams</div>
                  </a>
                  <a href="admin.html" class="nav-card">
                      <div class="nav-icon">⚙️</div>
                      <div class="nav-title">Admin Panel</div>
                      <div class="nav-desc">Reconfigure band parameters and export config.json</div>
                  </a>
                  <a href="takvim.html" class="nav-card">
                      <div class="nav-icon">📅</div>
                      <div class="nav-title">Calendar (Takvim)</div>
                      <div class="nav-desc">Gig schedules and availability calendar</div>
                  </a>
                  <a href="rehearsal.html" class="nav-card">
                      <div class="nav-icon">🎸</div>
                      <div class="nav-title">Rehearsal</div>
                      <div class="nav-desc">Practice logs and time tracking</div>
                  </a>
                  <a href="advisor.html" class="nav-card">
                      <div class="nav-icon">🧠</div>
                      <div class="nav-title">Advisor</div>
                      <div class="nav-desc">Setlist metrics and analytics</div>
                  </a>
                  <a href="fans.html" class="nav-card">
                      <div class="nav-icon">🙌</div>
                      <div class="nav-title">Fans</div>
                      <div class="nav-desc">Audience engagement and mailing lists</div>
                  </a>
              </div>
          </div>
          <script src="core/app.js"></script>
          <script>
              document.addEventListener("DOMContentLoaded", () => {
                  setTimeout(() => {
                      if (window.BandApp && window.BandApp.config) {
                          const conf = window.BandApp.config;
                          if (conf.band_name) document.getElementById("bandNameDisplay").innerText = conf.band_name;
                          if (conf.band_members && conf.band_members.length > 0) document.getElementById("bandMembersDisplay").innerText = conf.band_members.join(" • ");
                      }
                  }, 150);
              });
          </script>
          </body>
          </html>
          EOF

      # =========================================================================
      # 3. GENERATE setup.html (Theme System Selector)
      # =========================================================================
      - name: Generate setup.html
        run: |
          cat << 'EOF' > setup.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Theme Setup — Band Dashboard</title>
              <link rel="preconnect" href="https://fonts.googleapis.com">
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
              <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
              <style>
                  * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
                  body { background-color: var(--bg-primary, #f5f5f7); color: var(--text-main, #1d1d1f); font-family: var(--font-family, sans-serif); min-height: 100vh; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
                  .container { width: 100%; max-width: 900px; }
                  header { margin-bottom: 40px; text-align: center; }
                  h1 { font-size: 2.2rem; text-transform: var(--header-transform, none); margin-bottom: 8px; }
                  p.subtitle { color: var(--text-muted, #86868b); font-size: 1rem; }
                  .theme-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; margin-bottom: 40px; }
                  .theme-card { background-color: var(--bg-secondary, #ffffff); border: 2px solid var(--border-color, #d2d2d7); border-radius: var(--card-radius, 12px); padding: 24px; cursor: pointer; box-shadow: var(--box-shadow, none); display: flex; flex-direction: column; justify-content: space-between; }
                  .theme-card.active { border-color: var(--accent-color, #0071e3); border-width: 3px; }
                  .theme-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 12px; text-transform: var(--header-transform, none); }
                  .theme-desc { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; }
                  .btn-select { margin-top: 16px; padding: 10px 16px; background-color: var(--accent-color, #0071e3); color: #ffffff; border: none; border-radius: var(--card-radius, 6px); font-family: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer; width: 100%; }
                  .btn-select:hover { background-color: var(--accent-hover); }
                  .nav-back { display: inline-block; margin-top: 20px; color: var(--accent-color); text-decoration: none; font-weight: 600; }
              </style>
          </head>
          <body>
          <div class="container">
              <header>
                  <h1>Global Design Tokens</h1>
                  <p class="subtitle">Select an interface style to dynamically hydrate all Web App HTML views.</p>
              </header>
              <div class="theme-grid">
                  <div class="theme-card" id="card-hero" onclick="selectTheme('hero')">
                      <div>
                          <div class="theme-title">Hero</div>
                          <div class="theme-desc">Marvel Studios style. High-contrast, cinematic dark mode, obsidian tones, bold typography, and energetic crimson highlights.</div>
                      </div>
                      <button class="btn-select">Activate Hero</button>
                  </div>
                  <div class="theme-card" id="card-base" onclick="selectTheme('base')">
                      <div>
                          <div class="theme-title">Base</div>
                          <div class="theme-desc">Apple design team style. Ultra-clean, human-centered minimalism, rounded corners, soft shadows, and system typography.</div>
                      </div>
                      <button class="btn-select">Activate Base</button>
                  </div>
                  <div class="theme-card" id="card-rams" onclick="selectTheme('rams')">
                      <div>
                          <div class="theme-title">Rams</div>
                          <div class="theme-desc">Dieter Rams / Braun industrial design. Functional, matte off-white surfaces, zero decorative shadows, and Signal Orange accents.</div>
                      </div>
                      <button class="btn-select">Activate Rams</button>
                  </div>
              </div>
              <div style="text-align: center;">
                  <a href="index.html" class="nav-back">← Back to Landing Page</a>
              </div>
          </div>
          <script src="core/app.js"></script>
          <script>
              function updateActiveCard(themeName) {
                  document.querySelectorAll('.theme-card').forEach(card => card.classList.remove('active'));
                  const activeCard = document.getElementById(`card-${themeName}`);
                  if (activeCard) activeCard.classList.add('active');
              }
              function selectTheme(themeName) {
                  if (window.BandApp) {
                      window.BandApp.saveThemeSelection(themeName);
                      updateActiveCard(themeName);
                  }
              }
              document.addEventListener("DOMContentLoaded", () => {
                  setTimeout(() => { if (window.BandApp) updateActiveCard(window.BandApp.activeTheme); }, 100);
              });
          </script>
          </body>
          </html>
          EOF

      # =========================================================================
      # 4. GENERATE admin.html (Configuration Generator)
      # =========================================================================
      - name: Generate admin.html
        run: |
          cat << 'EOF' > admin.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Admin Panel - Band Dashboard Config Generator</title>
              <style>
                  :root { --bg-color: #0d1117; --card-bg: #161b22; --border-color: #30363d; --text-main: #c9d1d9; --text-muted: #8b949e; --accent-color: #238636; --accent-hover: #2ea043; --input-bg: #010409; --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
                  * { box-sizing: border-box; margin: 0; padding: 0; }
                  body { background-color: var(--bg-color); color: var(--text-main); font-family: var(--font-stack); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
                  .admin-container { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; width: 100%; max-width: 650px; padding: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
                  .admin-header { border-bottom: 1px solid var(--border-color); padding-bottom: 16px; margin-bottom: 24px; }
                  .admin-header h1 { font-size: 1.5rem; font-weight: 600; color: #ffffff; }
                  .admin-header p { font-size: 0.875rem; color: var(--text-muted); margin-top: 4px; }
                  .form-group { margin-bottom: 20px; }
                  label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 8px; color: var(--text-main); }
                  input[type="text"], input[type="url"] { width: 100%; padding: 10px 12px; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; color: #ffffff; font-size: 0.9rem; font-family: inherit; }
                  input[type="text"]:focus, input[type="url"]:focus { outline: none; border-color: #58a6ff; }
                  .help-text { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
                  .btn-submit { width: 100%; padding: 12px; background-color: var(--accent-color); color: #ffffff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
                  .btn-submit:hover { background-color: var(--accent-hover); }
                  .status-box { margin-top: 16px; padding: 12px; border-radius: 6px; font-size: 0.85rem; display: none; }
                  .status-box.success { display: block; background-color: rgba(46, 160, 67, 0.15); border: 1px solid #2ea043; color: #3fb950; }
              </style>
          </head>
          <body>
          <div class="admin-container">
              <div class="admin-header">
                  <h1>Band Dashboard — Configuration Generator</h1>
                  <p>Fill in the required parameters below to generate your <code>config.json</code> file.</p>
              </div>
              <form id="configForm">
                  <div class="form-group">
                      <label for="bandName">Band Name</label>
                      <input type="text" id="bandName" placeholder="e.g., The Velvet Echoes" required>
                  </div>
                  <div class="form-group">
                      <label for="bandMembers">Band Members (Comma Separated)</label>
                      <input type="text" id="bandMembers" placeholder="e.g., Alex (Vocals), Maya (Guitar), Sam (Drums)" required>
                  </div>
                  <div class="form-group">
                      <label for="googleSheetsApiUrl">Google Apps Script Web App Deployment URL</label>
                      <input type="url" id="googleSheetsApiUrl" placeholder="https://script.google.com/macros/s/.../exec" required>
                  </div>
                  <div class="form-group">
                      <label for="ugPlaylistLink">Ultimate Guitar Playlist Link</label>
                      <input type="url" id="ugPlaylistLink" placeholder="https://www.ultimate-guitar.com/user/playlist/..." required>
                  </div>
                  <button type="submit" class="btn-submit">Generate & Download config.json</button>
              </form>
              <div id="statusBox" class="status-box"></div>
          </div>
          <script>
              document.getElementById('configForm').addEventListener('submit', function(e) {
                  e.preventDefault();
                  const configData = {
                      band_name: document.getElementById('bandName').value.trim(),
                      band_members: document.getElementById('bandMembers').value.split(',').map(m => m.trim()).filter(m => m.length > 0),
                      google_sheets_api_url: document.getElementById('googleSheetsApiUrl').value.trim(),
                      ug_playlist_link: document.getElementById('ugPlaylistLink').value.trim(),
                      active_theme: "base",
                      created_at: new Date().toISOString()
                  };
                  const blob = new Blob([JSON.stringify(configData, null, 2)], { type: "application/json" });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href = url;
                  a.download = 'config.json';
                  document.body.appendChild(a);
                  a.click();
                  document.body.removeChild(a);
                  URL.revokeObjectURL(url);
                  const statusBox = document.getElementById('statusBox');
                  statusBox.className = "status-box success";
                  statusBox.innerHTML = "<strong>config.json generated!</strong> Place this file into the root directory of your GitHub repository and commit changes.";
              });
          </script>
          </body>
          </html>
          EOF

      # =========================================================================
      # 5. GENERATE playlist.html (Interactive Drag & Drop Setlist View)
      # =========================================================================
      - name: Generate playlist.html
        run: |
          cat << 'EOF' > playlist.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Playlist & Setlist — Band Dashboard</title>
              <link rel="preconnect" href="https://fonts.googleapis.com">
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
              <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
              <style>
                  * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease; }
                  body { background-color: var(--bg-primary, #f5f5f7); color: var(--text-main, #1d1d1f); font-family: var(--font-family, sans-serif); min-height: 100vh; padding: 30px 16px; display: flex; flex-direction: column; align-items: center; }
                  .container { width: 100%; max-width: 950px; }
                  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
                  h1 { font-size: 2rem; text-transform: var(--header-transform, none); }
                  .actions-bar { display: flex; gap: 12px; align-items: center; }
                  .btn { padding: 8px 16px; background-color: var(--accent-color, #0071e3); color: #ffffff; border: none; border-radius: var(--card-radius, 6px); font-family: inherit; font-size: 0.875rem; font-weight: 600; cursor: pointer; }
                  .btn-secondary { background-color: var(--bg-surface, #e8e8ed); color: var(--text-main, #1d1d1f); border: 1px solid var(--border-color, #d2d2d7); }
                  .playlist-card { background-color: var(--bg-secondary, #ffffff); border: 1px solid var(--border-color, #d2d2d7); border-radius: var(--card-radius, 12px); overflow: hidden; }
                  .song-list { list-style: none; }
                  .song-item { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border-color, #e5e5ea); background-color: var(--bg-secondary, #ffffff); user-select: none; }
                  .song-item:last-child { border-bottom: none; }
                  .song-item.dragging { opacity: 0.4; background-color: var(--bg-surface, #f0f0f5); }
                  .drag-handle { cursor: grab; padding-right: 14px; color: var(--text-muted, #86868b); font-size: 1.2rem; }
                  .song-index { width: 32px; font-size: 0.85rem; font-weight: 700; color: var(--text-muted, #86868b); }
                  .song-details { flex-grow: 1; padding-right: 16px; }
                  .song-title { font-size: 1rem; font-weight: 600; color: var(--text-main, #1d1d1f); text-decoration: none; cursor: pointer; }
                  .song-title:hover { color: var(--accent-color, #0071e3); text-decoration: underline; }
                  .artist-name { font-size: 0.825rem; color: var(--text-muted, #86868b); margin-top: 2px; }
                  .rhs-controls { display: flex; align-items: center; gap: 12px; }
                  .key-badge { display: flex; align-items: center; gap: 4px; font-size: 0.8rem; color: var(--text-muted, #86868b); }
                  .key-input { width: 55px; padding: 4px 6px; background-color: var(--bg-primary, #f5f5f7); border: 1px solid var(--border-color, #d2d2d7); border-radius: var(--card-radius, 4px); color: var(--text-main, #1d1d1f); font-size: 0.85rem; font-weight: 600; text-align: center; text-transform: uppercase; }
                  .play-btn { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background-color: var(--bg-surface, #e8e8ed); color: var(--accent-color, #0071e3); text-decoration: none; font-size: 0.9rem; }
                  .status-toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 18px; background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--card-radius, 8px); color: var(--text-main); font-size: 0.85rem; display: none; z-index: 100; }
                  .nav-link { display: inline-block; margin-top: 20px; color: var(--accent-color); text-decoration: none; font-weight: 600; }
              </style>
          </head>
          <body>
          <div class="container">
              <header>
                  <div>
                      <h1>Band Setlist</h1>
                      <p id="song-count-meta" style="color: var(--text-muted); font-size: 0.875rem; margin-top: 4px;">Loading setlist...</p>
                  </div>
                  <div class="actions-bar">
                      <button class="btn btn-secondary" onclick="shufflePlaylist()">🔀 Shuffle</button>
                      <button class="btn" onclick="saveOrderToRemote()">💾 Save Order</button>
                  </div>
              </header>
              <div class="playlist-card">
                  <ul class="song-list" id="songList"></ul>
              </div>
              <div style="text-align: center;">
                  <a href="index.html" class="nav-link">← Back to Landing Page</a>
              </div>
          </div>
          <div id="statusToast" class="status-toast"></div>
          <script src="core/app.js"></script>
          <script>
              let currentSongs = [];
              function showToast(msg) {
                  const toast = document.getElementById("statusToast");
                  toast.innerText = msg;
                  toast.style.display = "block";
                  setTimeout(() => { toast.style.display = "none"; }, 2500);
              }
              async function fetchPlaylistData() {
                  try {
                      const res = await fetch("playlist.json");
                      if (res.ok) { currentSongs = await res.json(); renderPlaylist(currentSongs); }
                  } catch (e) {}

                  if (window.BandApp && window.BandApp.config && window.BandApp.config.google_sheets_api_url) {
                      try {
                          const apiRes = await fetch(`${window.BandApp.config.google_sheets_api_url}?action=readTab&tab=song-info`);
                          const json = await apiRes.json();
                          if (json.status === "success" && json.data.length > 0) {
                              currentSongs = json.data.map((row, idx) => ({
                                  index: row.Index || (idx + 1),
                                  songName: row["Song Name"] || "",
                                  artistName: row["Artist Name"] || "",
                                  key: row.Key || ""
                              }));
                              renderPlaylist(currentSongs);
                          }
                      } catch (err) {}
                  }
              }
              function renderPlaylist(songs) {
                  const listContainer = document.getElementById("songList");
                  listContainer.innerHTML = "";
                  document.getElementById("song-count-meta").innerText = `${songs.length} Tracks in Setlist`;

                  songs.forEach((song, idx) => {
                      const li = document.createElement("li");
                      li.className = "song-item";
                      li.draggable = true;
                      li.dataset.index = idx;
                      const ytUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(song.songName + ' ' + song.artistName)}`;
                      const safeSong = song.songName.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
                      const safeArtist = song.artistName.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
                      const lyricsFile = `${idx + 1}-${safeSong}-${safeArtist}.txt`;

                      li.innerHTML = `
                          <div class="drag-handle">⋮⋮</div>
                          <div class="song-index">${idx + 1}</div>
                          <div class="song-details">
                              <a class="song-title" onclick="openLyricsViewer('${song.songName}', '${song.artistName}', '${lyricsFile}')">${song.songName}</a>
                              <div class="artist-name">${song.artistName}</div>
                          </div>
                          <div class="rhs-controls">
                              <div class="key-badge">
                                  <span>KEY</span>
                                  <input type="text" class="key-input" value="${song.key || ''}" onchange="updateKey('${song.songName}', '${song.artistName}', this.value)" placeholder="—">
                              </div>
                              <a href="${ytUrl}" target="_blank" class="play-btn" title="Search on YouTube">▶</a>
                          </div>
                      `;
                      li.addEventListener("dragstart", handleDragStart);
                      li.addEventListener("dragover", handleDragOver);
                      li.addEventListener("drop", handleDrop);
                      li.addEventListener("dragend", handleDragEnd);
                      listContainer.appendChild(li);
                  });
              }

              let draggedItem = null;
              function handleDragStart(e) { draggedItem = this; this.classList.add("dragging"); }
              function handleDragOver(e) { e.preventDefault(); }
              function handleDrop(e) {
                  e.stopPropagation();
                  if (draggedItem !== this) {
                      const list = document.getElementById("songList");
                      const allItems = Array.from(list.children);
                      if (allItems.indexOf(draggedItem) < allItems.indexOf(this)) this.after(draggedItem);
                      else this.before(draggedItem);
                      reindexLocalState();
                  }
              }
              function handleDragEnd() { this.classList.remove("dragging"); }
              function reindexLocalState() {
                  const newSongs = [];
                  document.querySelectorAll(".song-item").forEach((item, newIdx) => {
                      item.querySelector(".song-index").innerText = newIdx + 1;
                      newSongs.push({
                          index: newIdx + 1,
                          songName: item.querySelector(".song-title").innerText,
                          artistName: item.querySelector(".artist-name").innerText,
                          key: item.querySelector(".key-input").value
                      });
                  });
                  currentSongs = newSongs;
              }
              async function updateKey(songName, artistName, newKey) {
                  showToast(`Updating key...`);
                  const songObj = currentSongs.find(s => s.songName === songName && s.artistName === artistName);
                  if (songObj) songObj.key = newKey;
                  if (window.BandApp && window.BandApp.config && window.BandApp.config.google_sheets_api_url) {
                      try {
                          await fetch(window.BandApp.config.google_sheets_api_url, {
                              method: "POST",
                              headers: { "Content-Type": "text/plain;charset=utf-8" },
                              body: JSON.stringify({ action: "updateSongKey", payload: { songName, artistName, key: newKey } })
                          });
                          showToast("Key saved to Google Sheets!");
                      } catch (err) {}
                  }
              }
              async function saveOrderToRemote() {
                  showToast("Saving order...");
                  if (window.BandApp && window.BandApp.config && window.BandApp.config.google_sheets_api_url) {
                      try {
                          await fetch(window.BandApp.config.google_sheets_api_url, {
                              method: "POST",
                              headers: { "Content-Type": "text/plain;charset=utf-8" },
                              body: JSON.stringify({ action: "savePlaylistOrder", payload: { songs: currentSongs } })
                          });
                          showToast("Order saved!");
                      } catch (err) {}
                  }
              }
              function shufflePlaylist() {
                  for (let i = currentSongs.length - 1; i > 0; i--) {
                      const j = Math.floor(Math.random() * (i + 1));
                      [currentSongs[i], currentSongs[j]] = [currentSongs[j], currentSongs[i]];
                  }
                  renderPlaylist(currentSongs);
              }
              function openLyricsViewer(title, artist, filename) {
                  const lyricWindow = window.open("", "_blank");
                  lyricWindow.document.write(`
                      <!DOCTYPE html><html><head><title>${title} - ${artist}</title>
                      <style>body{background:#000;color:#fff;font-family:'Courier New',monospace;padding:24px;}
                      .bar{position:sticky;top:0;background:#111;padding:12px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-family:sans-serif;}
                      pre{white-space:pre-wrap;word-wrap:break-word;line-height:1.6;font-size:18px;}</style></head>
                      <body><div class="bar"><div><h2 style="margin:0">${title}</h2><p style="margin:2px 0 0;color:#888;">${artist}</p></div>
                      <div><label>Font Size: </label><input type="range" min="12" max="36" value="18" oninput="document.getElementById('lyricsText').style.fontSize=this.value+'px'"></div></div>
                      <pre id="lyricsText">Loading lyrics...</pre>
                      <script>fetch('songs/${filename}').then(r=>r.text()).then(t=>document.getElementById('lyricsText').innerText=t).catch(e=>document.getElementById('lyricsText').innerText='Lyrics unavailable.');<\/script></body></html>
                  `);
                  lyricWindow.document.close();
              }
              document.addEventListener("DOMContentLoaded", fetchPlaylistData);
          </script>
          </body>
          </html>
          EOF

      # =========================================================================
      # 6. GENERATE Modular Shell Stubs (takvim, rehearsal, advisor, fans)
      # =========================================================================
      - name: Generate Modular Shell Stubs
        run: |
          for view in takvim rehearsal advisor fans; do
            cat << EOF > ${view}.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>${view} — Band Dashboard</title>
              <style>
                  * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s ease, color 0.3s ease; }
                  body { background-color: var(--bg-primary, #f5f5f7); color: var(--text-main, #1d1d1f); font-family: var(--font-family, sans-serif); min-height: 100vh; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
                  .stub-card { background-color: var(--bg-secondary, #ffffff); border: 1px solid var(--border-color, #d2d2d7); border-radius: var(--card-radius, 16px); padding: 40px; max-width: 600px; width: 100%; box-shadow: var(--box-shadow, none); }
                  h1 { font-size: 2rem; text-transform: var(--header-transform, capitalize); margin-bottom: 12px; }
                  p { color: var(--text-muted, #86868b); font-size: 1rem; margin-bottom: 24px; }
                  a { color: var(--accent-color, #0071e3); text-decoration: none; font-weight: 600; }
              </style>
          </head>
          <body>
          <div class="stub-card">
              <h1>${view} Module</h1>
              <p>This view shell is active and ready for custom dynamic hydration connected to Google Sheets.</p>
              <a href="index.html">← Back to Landing Page</a>
          </div>
          <script src="core/app.js"></script>
          </body>
          </html>
          EOF
          done

      # =========================================================================
      # 7. GENERATE .github/workflows/sync_engine.yml
      # =========================================================================
      - name: Generate .github/workflows/sync_engine.yml
        run: |
          cat << 'EOF' > .github/workflows/sync_engine.yml
          name: Band Dashboard Sync Engine Pipeline

          on:
            schedule:
              - cron: '0 0 * * *'
            workflow_dispatch:
              inputs:
                force_sync:
                  description: 'Force clean full sync'
                  required: false
                  default: 'false'

          permissions:
            contents: write

          jobs:
            sync_and_fetch:
              runs-on: ubuntu-latest
              name: Execute Scraping, Sheet Diff, and Lyrics Ingestion

              steps:
                - name: Checkout Repository
                  uses: actions/checkout@v4
                  with:
                    token: ${{ secrets.GITHUB_TOKEN }}
                    fetch-depth: 0

                - name: Set up Python Environment
                  uses: actions/setup-python@v5
                  with:
                    python-version: '3.11'

                - name: Install Python Dependencies
                  run: |
                    python -m pip install --upgrade pip
                    pip install requests beautifulsoup4

                - name: Execute Sync Engine Pipeline Script
                  env:
                    GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
                  run: |
                    python - << 'PYEOF'
                    import os
                    import re
                    import json
                    import time
                    import urllib.parse
                    import requests

                    def extract_songs_from_ug_json(data):
                        songs = []
                        def recurse(node):
                            if isinstance(node, dict):
                                song_name = node.get("song_name") or node.get("song_title") or node.get("title")
                                artist_name = node.get("artist_name") or node.get("artist")
                                if song_name and artist_name and isinstance(song_name, str) and isinstance(artist_name, str):
                                    if not ("playlist" in song_name.lower() and "ultimate" in artist_name.lower()):
                                        songs.append({
                                            "songName": song_name.strip(),
                                            "artistName": artist_name.strip()
                                        })
                                        return
                                for k, v in node.items():
                                    recurse(v)
                            elif isinstance(node, list):
                                for item in node:
                                    recurse(item)

                        recurse(data)
                        seen = set()
                        deduped = []
                        for s in songs:
                            identifier = f"{s['songName'].lower()}___{s['artistName'].lower()}"
                            if identifier not in seen:
                                seen.add(identifier)
                                deduped.append(s)
                        return deduped

                    def main():
                        config_path = "config.json"
                        if not os.path.exists(config_path):
                            print(f"Error: {config_path} missing in root repository.")
                            return

                        with open(config_path, "r", encoding="utf-8") as f:
                            config = json.load(f)

                        ug_url = config.get("ug_playlist_link") or config.get("ug_link")
                        gas_url = os.environ.get("GOOGLE_SCRIPT_URL") or config.get("google_sheets_api_url")

                        if not ug_url or not gas_url:
                            print("Error: Missing config links.")
                            return

                        headers = {
                            "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
                            "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                            "Accept-Language": "en-US,en;q=0.9"
                        }

                        scraped_songs = []
                        try:
                            res = requests.get(ug_url, headers=headers, timeout=20)
                            res.raise_for_status()
                            match = re.search(r'window\.UGAPP\.store\.page\s*=\s*({.*?});</script>', res.text, re.DOTALL)
                            if not match:
                                match = re.search(r'window\.UGAPP\.store\.page\s*=\s*({.*?});', res.text, re.DOTALL)

                            if match:
                                page_data = json.loads(match.group(1))
                                scraped_songs = extract_songs_from_ug_json(page_data)
                        except Exception as e:
                            print(f"Error scraping UG: {e}")

                        if not scraped_songs and os.path.exists("playlist.json"):
                            with open("playlist.json", "r", encoding="utf-8") as f:
                                scraped_songs = json.load(f)

                        print(f"Total songs parsed: {len(scraped_songs)}")
                        if len(scraped_songs) == 0:
                            print("0 songs scraped. Guarding against sheet clear.")
                            return

                        payload = {"action": "syncScrapedPlaylist", "payload": {"songs": scraped_songs}}
                        try:
                            requests.post(gas_url, json=payload, timeout=20)
                        except Exception as e:
                            print(f"Error posting to Apps Script: {e}")

                        updated_playlist = []
                        try:
                            read_res = requests.get(f"{gas_url}?action=readTab&tab=song-info", timeout=15)
                            read_json = read_res.json()
                            if read_json.get("status") == "success":
                                for idx, row in enumerate(read_json.get("data", [])):
                                    updated_playlist.append({
                                        "index": row.get("Index", idx + 1),
                                        "songName": row.get("Song Name", ""),
                                        "artistName": row.get("Artist Name", ""),
                                        "key": row.get("Key", "")
                                    })
                        except Exception as e:
                            updated_playlist = scraped_songs

                        with open("playlist.json", "w", encoding="utf-8") as f:
                            json.dump(updated_playlist, f, indent=2, ensure_ascii=False)

                        os.makedirs("songs", exist_ok=True)
                        for idx, track in enumerate(updated_playlist, start=1):
                            song_title = track.get("songName", "").strip()
                            artist_name = track.get("artistName", "").strip()
                            if not song_title or not artist_name: continue

                            safe_song = re.sub(r'-+', '-', re.sub(r'[^a-zA-Z0-9]', '-', song_title.lower())).strip('-')
                            safe_artist = re.sub(r'-+', '-', re.sub(r'[^a-zA-Z0-9]', '-', artist_name.lower())).strip('-')
                            file_path = os.path.join("songs", f"{idx}-{safe_song}-{safe_artist}.txt")

                            if os.path.exists(file_path): continue

                            query_url = f"https://lrclib.net/api/get?artist_name={urllib.parse.quote(artist_name)}&track_name={urllib.parse.quote(song_title)}"
                            lyrics_text = ""
                            try:
                                l_res = requests.get(query_url, timeout=10)
                                if l_res.status_code == 200:
                                    lyrics_text = l_res.json().get("plainLyrics") or l_res.json().get("syncedLyrics") or ""
                                else:
                                    search_url = f"https://lrclib.net/api/search?q={urllib.parse.quote(song_title + ' ' + artist_name)}"
                                    s_res = requests.get(search_url, timeout=10)
                                    if s_res.status_code == 200 and len(s_res.json()) > 0:
                                        lyrics_text = s_res.json()[0].get("plainLyrics") or s_res.json()[0].get("syncedLyrics") or ""
                            except Exception as err: pass

                            if not lyrics_text:
                                lyrics_text = f"Lyrics for '{song_title}' by '{artist_name}' could not be located."

                            with open(file_path, "w", encoding="utf-8") as lf:
                                lf.write(f"Title: {song_title}\nArtist: {artist_name}\n\n" + lyrics_text)
                            time.sleep(0.5)

                    if __name__ == "__main__":
                        main()
                    PYEOF

      # =========================================================================
      # 8. ATOMIC COMMIT & PUSH TO REPOSITORY ROOT
      # =========================================================================
      - name: Commit and Push All Root Repository Files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add core/app.js index.html setup.html admin.html playlist.html takvim.html rehearsal.html advisor.html fans.html .github/workflows/sync_engine.yml
          
          if git diff --staged --quiet; then
            echo "All root files are fully synchronized. No changes detected."
          else
            git commit -m "build(bootstrap): full universal override of root application files & workflows"
            git push
          fi
