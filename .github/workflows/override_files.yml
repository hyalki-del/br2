name: Universal Payload Execution Engine

on:
  workflow_dispatch:
    inputs:
      base64_payload:
        description: 'Paste your Base64 encoded payload here'
        required: true
        type: string

permissions:
  contents: write

jobs:
  execute_payload:
    runs-on: ubuntu-latest
    name: Execute Unpacked Base64 Payload

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & Playwright
        run: |
          mkdir -p core .github/workflows songs
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Decode Base64 and Unpack Files
        env:
          B64_INPUT: ${{ inputs.base64_payload }}
        run: |
          python3 - << 'PYEOF'
          import os, base64, re

          b64_str = os.environ.get("B64_INPUT", "").strip()
          if not b64_str:
              raise ValueError("Input Base64 string was empty.")

          # Decode bytes and restore UTF-8 string
          decoded_text = base64.b64decode(b64_str).decode("utf-8")

          # Tokenize using delimiter === FILE: filename ===
          pattern = r"===\s*FILE:\s*([^\s=]+(?:\/[^\s=]+)*)\s*==="
          tokens = re.split(pattern, decoded_text)

          if len(tokens) < 3:
              raise ValueError("No valid '=== FILE: filepath ===' sections found in payload.")

          files_written = 0
          for i in range(1, len(tokens), 2):
              filepath = tokens[i].strip()
              content = tokens[i+1]

              if not filepath:
                  continue

              dirpath = os.path.dirname(filepath)
              if dirpath:
                  os.makedirs(dirpath, exist_ok=True)

              with open(filepath, "w", encoding="utf-8", newline="\n") as f:
                  f.write(content.strip() + "\n")

              print(f"[Engine] Written: {filepath}")
              files_written += 1

          print(f"[Engine] Unpacking complete. Total files processed: {files_written}")
          PYEOF

      - name: Execute Automated Scraper Engine
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
        run: |
          if [ -f "scraper.py" ]; then
            python3 scraper.py
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "build(payload): executed base64 payload update"
            git push
          fi
