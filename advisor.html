 <!DOCTYPE html> <html lang="en"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">     <title>Baba Rock - Şarkı Seçici</title>      <script>         (function() {             const savedTheme = localStorage.getItem('babarock_theme') || 'default';             document.documentElement.setAttribute('data-theme', savedTheme);         })();     </script>      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">     <link rel="stylesheet" href="css/core.css?v=BUILD_SHA">     <link rel="stylesheet" href="css/theme-apple.css?v=BUILD_SHA">     <link rel="stylesheet" href="css/theme-marvel.css?v=BUILD_SHA">     <link rel="stylesheet" href="css/theme-wb.css?v=BUILD_SHA">      <style>         .page-card {             max-width: 480px;             width: 100%;             padding: 28px;             background: rgba(18, 18, 18, 0.92);             border: 1px solid var(--hex-border);             border-radius: 20px;             box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);             backdrop-filter: blur(12px);             -webkit-backdrop-filter: blur(12px);             display: flex;             flex-direction: column;             gap: 20px;             text-align: center;         }          .header-nav {             display: flex;             justify-content: space-between;             align-items: center;             border-bottom: 1px solid rgba(255, 255, 255, 0.15);             padding-bottom: 12px;         }          .btn-back {             padding: 8px 16px;             background: var(--hex-border);             color: #fff;             text-decoration: none;             border-radius: 8px;             font-weight: 700;             font-size: 0.85rem;         }          .song-display {             padding: 24px;             background: rgba(255, 255, 255, 0.05);             border: 2px dashed var(--hex-border);             border-radius: 16px;             min-height: 120px;             display: flex;             flex-direction: column;             justify-content: center;             align-items: center;             gap: 8px;         }          .song-title {             font-size: 1.5rem;             font-weight: 800;             color: #fff;         }          .song-artist {             font-size: 1.1rem;             color: var(--hex-icon);         }          .btn-pick {             width: 100%;             padding: 16px;             background: var(--hex-border);             color: #fff;             border: none;             border-radius: 12px;             font-size: 1.1rem;             font-weight: 800;             cursor: pointer;             display: flex;             align-items: center;             justify-content: center;             gap: 10px;             transition: transform 0.2s ease;         }          .btn-pick:active {             transform: scale(0.97);         }     </style> </head> <body>      <div class="bg-container">         <img id="fullBgImage" src="https://hyalki-del.github.io/babarock/9E3DB23C-F5C1-438B-91E7-323E8FEE34AD_4_5005_c.jpeg" alt="Background" class="bg-image">     </div>      <div class="dotted-overlay"></div>      <main class="main-wrapper" style="margin-top: 30px;">         <div class="page-card">             <div class="header-nav">                 <h2><i class="fa-solid fa-dice"></i> Rastgele Şarkı Seçici</h2>                 <a href="index.html" class="btn-back">Geri</a>             </div>              <div class="song-display" id="displayBox">                 <div class="song-title" id="songTitle">Sıradaki Şarkıyı Seç!</div>                 <div class="song-artist" id="songArtist">Butona tıklayarak rastgele bir şarkı çekin.</div>             </div>              <button class="btn-pick" id="pickBtn">                 <i class="fa-solid fa-dice-five"></i> Rastgele Şarkı Seç             </button>         </div>     </main>      <script>         let songList = [];          fetch('songs.json?v=' + Date.now())             .then(res => res.json())             .then(data => { songList = data; })             .catch(err => console.error(err));          document.getElementById('pickBtn').addEventListener('click', () => {             if (!songList || songList.length === 0) {                 alert('Şarkı listesi bulunamadı!');                 return;             }              const displayBox = document.getElementById('displayBox');             displayBox.style.opacity = '0.5';              setTimeout(() => {                 const randomIndex = Math.floor(Math.random() * songList.length);                 const selected = songList[randomIndex];                  document.getElementById('songTitle').innerText = selected.title;                 document.getElementById('songArtist').innerText = selected.artist + (selected.key ? ` (${selected.key})` : '');                 displayBox.style.opacity = '1';             }, 200);         });     </script>      <script src="js/setup.js?v=BUILD_SHA"></script>     <script src="js/script.js?v=BUILD_SHA"></script> </body> </html>
