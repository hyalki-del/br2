name: Daily Ultimate Guitar Song List Sync

on:
  schedule:
    # Runs daily at 03:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      ug_url:
        description: 'Optional Ultimate Guitar Playlist/Tab URL (leave blank to use saved config)'
        required: false
        type: string

jobs:
  sync-songs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and Sync Ultimate Guitar Data
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const https = require('https');

            // 1. Determine UG URL from input or config.json
            let ugUrl = context.payload.inputs ? context.payload.inputs.ug_url : '';
            
            if (!ugUrl && fs.existsSync('config.json')) {
              try {
                const config = JSON.parse(fs.readFileSync('config.json', 'utf8'));
                ugUrl = config.ugPlaylistUrl || '';
              } catch (e) {
                console.log('Error reading config.json:', e.message);
              }
            }

            if (!ugUrl) {
              console.log('No Ultimate Guitar URL provided. Skipping fetch.');
              return;
            }

            console.log('Fetching Ultimate Guitar Data from:', ugUrl);

            // Helper function for HTTP requests
            function fetchUrl(url) {
              return new Promise((resolve, reject) => {
                https.get(url, { headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' } }, (res) => {
                  let data = '';
                  res.on('data', chunk => data += chunk);
                  res.on('end', () => resolve(data));
                }).on('error', err => reject(err));
              });
            }

            try {
              const html = await fetchUrl(ugUrl);
              
              // Extract embedded store data from Ultimate Guitar HTML page
              const storeMatch = html.match(/class="js-store" data-content="([^"]+)"/);
              let parsedSongs = [];

              if (storeMatch) {
                const decodedJson = storeMatch[1].replace(/&quot;/g, '"').replace(/&amp;/g, '&');
                const storeData = JSON.parse(decodedJson);
                
                // Traverse UG store payload for tab entries
                const tabs = storeData?.store?.page_data?.data?.tabs || storeData?.store?.page_data?.tabs || [];
                
                parsedSongs = tabs.map((tab, idx) => ({
                  id: tab.id || idx + 1,
                  artist: tab.artist_name || 'Unknown Artist',
                  title: tab.song_name || 'Untitled Song',
                  type: tab.type_name || 'Chords',
                  rating: tab.rating ? Number(tab.rating).toFixed(1) : '5.0',
                  key: tab.tonality_name || 'Standard',
                  url: tab.tab_url || ugUrl
                }));
              }

              if (parsedSongs.length > 0) {
                fs.writeFileSync('songs.json', JSON.stringify(parsedSongs, null, 2), 'utf8');
                console.log(`Successfully synced ${parsedSongs.length} songs to songs.json`);
              } else {
                console.log('No new tabs found in UG response. Preserving existing songs.json.');
              }
            } catch (err) {
              console.error('Error fetching UG data:', err.message);
            }

      - name: Commit and Push Updated Song Catalog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add songs.json config.json || true
          git commit -m "Automated Sync: Updated songs.json from Ultimate Guitar" || echo "No song changes to commit"
          git push
