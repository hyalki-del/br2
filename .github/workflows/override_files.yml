name: Universal Payload Execution Engine

on:
  workflow_dispatch:
    inputs:
      code_payload:
        description: 'Paste your complete plain-text bash payload here'
        required: true
        type: string

permissions:
  contents: write

jobs:
  execute_payload:
    runs-on: ubuntu-latest
    name: Execute Plain-Text Payload

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & Playwright
        run: |
          mkdir -p core .github/workflows songs
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Write Plain-Text Payload to Script File
        env:
          RAW_PAYLOAD: ${{ inputs.code_payload }}
        run: |
          python3 - << 'PYEOF'
          import os

          # Read raw string safely from environment variable (bypasses shell evaluation)
          payload_text = os.environ.get("RAW_PAYLOAD", "").strip()

          if not payload_text:
              raise ValueError("Payload input was empty.")

          # Write raw script preserving exact line breaks and formatting
          with open("execute_payload.sh", "w", encoding="utf-8", newline="\n") as out:
              out.write(payload_text)

          print("[Engine] Script successfully written to execute_payload.sh")
          PYEOF

      - name: Execute Script Payload
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
        run: |
          # Sanitize DOS CRLF line endings to Unix LF and grant executable rights
          sed -i 's/\r$//' execute_payload.sh
          chmod +x execute_payload.sh

          # Execute generated payload
          ./execute_payload.sh

          # Clean workspace
          rm execute_payload.sh

      - name: Commit and Push Updated Application State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          
          if git diff --staged --quiet; then
            echo "No repository changes detected after payload execution."
          else
            git commit -m "build(payload): executed remote text payload update"
            git push
          fi
