name: Universal Payload Execution Engine

on:
  workflow_dispatch:
    inputs:
      code_payload:
        description: 'Paste plain-text multi-file payload here'
        required: false
        type: string

permissions:
  contents: write

jobs:
  execute_payload:
    runs-on: ubuntu-latest
    name: Unpack Frontend & Execute Setlist Sync Engine

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & Playwright Chromium
        run: |
          mkdir -p core .github/workflows songs
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Unpack Web Frontend Payload Files
        env:
          RAW_INPUT: ${{ inputs.code_payload }}
        run: |
          python3 - << 'PYEOF'
          import os, re

          raw_text = os.environ.get("RAW_INPUT", "").strip()
          if not raw_text:
              print("[Workflow] Frontend payload empty; proceeding directly to execution.")
              exit(0)

          # Parse multi-file payload using delimiter === FILE: path ===
          pattern = r"===\s*FILE:\s*([^\s=]+(?:\/[^\s=]+)*)\s*==="
          tokens = re.split(pattern, raw_text)

          if len(tokens) >= 3:
              files_written = 0
              for i in range(1, len(tokens), 2):
                  filepath = tokens[i].strip()
                  content = tokens[i+1]

                  if filepath == "scraper.py":
                      print("[Workflow] Protected file 'scraper.py' detected in payload. Skipping write to safeguard root script.")
                      continue

                  dirpath = os.path.dirname(filepath)
                  if dirpath:
                      os.makedirs(dirpath, exist_ok=True)

                  with open(filepath, "w", encoding="utf-8", newline="\n") as f:
                      f.write(content.strip() + "\n")

                  print(f"[Engine] Successfully wrote web asset: {filepath}")
                  files_written += 1

              print(f"[Workflow] Unpacking complete. Total web assets updated: {files_written}")
          else:
              print("[Workflow] Header pattern '=== FILE: filepath ===' not detected. No frontend assets modified.")
          PYEOF

      - name: Execute Native Scraper Engine
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
        run: |
          if [ -f "scraper.py" ]; then
            python3 scraper.py
          else
            echo "Error: scraper.py not found in root directory!"
            exit 1
          fi

      - name: Commit and Push Updated Application State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          
          if git diff --staged --quiet; then
            echo "No repository changes detected after payload execution."
          else
            git commit -m "build(payload): executed web asset update & setlist sync"
            git push
          fi
