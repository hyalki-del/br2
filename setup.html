<!DOCTYPE html> <html lang="en"> <head>     <meta charset="UTF-8">     <title>Theme Setup — Band Dashboard</title>     <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">     <style>         * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s; }         body { background-color: var(--bg-primary, #f5f5f7); color: var(--text-main, #1d1d1f); font-family: var(--font-family, sans-serif); min-height: 100vh; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }         .container { width: 100%; max-width: 900px; }         header { margin-bottom: 40px; text-align: center; }         h1 { font-size: 2.2rem; text-transform: var(--header-transform, none); margin-bottom: 8px; }         .theme-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; margin-bottom: 40px; }         .theme-card { background-color: var(--bg-secondary, #ffffff); border: 2px solid var(--border-color, #d2d2d7); border-radius: var(--card-radius, 12px); padding: 24px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; }         .theme-card.active { border-color: var(--accent-color, #0071e3); border-width: 3px; }         .theme-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 12px; text-transform: var(--header-transform, none); }         .theme-desc { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 20px; }         .btn-select { padding: 10px 16px; background-color: var(--accent-color, #0071e3); color: #ffffff; border: none; border-radius: var(--card-radius, 6px); font-size: 0.9rem; font-weight: 600; cursor: pointer; width: 100%; }         .nav-back { color: var(--accent-color); text-decoration: none; font-weight: 600; }     </style> </head> <body> <div class="container">     <header><h1>Global Design Tokens</h1><p>Select an interface style:</p></header>     <div class="theme-grid">         <div class="theme-card" id="card-hero" onclick="selectTheme('hero')">             <div><div class="theme-title">Hero</div><div class="theme-desc">Marvel Studios style. Dark mode, obsidian tones, bold typography.</div></div>             <button class="btn-select">Activate Hero</button>         </div>         <div class="theme-card" id="card-base" onclick="selectTheme('base')">             <div><div class="theme-title">Base</div><div class="theme-desc">Apple designer style. Ultra-clean minimalism and smooth curves.</div></div>             <button class="btn-select">Activate Base</button>         </div>         <div class="theme-card" id="card-rams" onclick="selectTheme('rams')">             <div><div class="theme-title">Rams</div><div class="theme-desc">Dieter Rams style. Industrial off-white, Courier font, Signal Orange.</div></div>             <button class="btn-select">Activate Rams</button>         </div>     </div>     <div style="text-align: center;"><a href="index.html" class="nav-back">← Back to Landing Page</a></div> </div> <script src="core/app.js"></script> <script>     function updateActiveCard(t) {         document.querySelectorAll('.theme-card').forEach(c => c.classList.remove('active'));         const el = document.getElementById(`card-${t}`);         if (el) el.classList.add('active');     }     function selectTheme(t) {         if (window.BandApp) { window.BandApp.saveThemeSelection(t); updateActiveCard(t); }     }     document.addEventListener("DOMContentLoaded", () => setTimeout(() => { if (window.BandApp) updateActiveCard(window.BandApp.activeTheme); }, 100)); </script> </body> </html>
