 <!DOCTYPE html> <html lang="tr"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">     <title>Baba Rock - Tema Ayarları</title>     <script>         (function() {             const savedTheme = localStorage.getItem('babarock_theme') || 'apple';             document.documentElement.setAttribute('data-theme', savedTheme);         })();     </script>     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">     <link rel="stylesheet" href="css/core.css?v=e8204b8">     <link rel="stylesheet" href="css/theme-apple.css?v=e8204b8">     <link rel="stylesheet" href="css/theme-marvel.css?v=e8204b8">     <link rel="stylesheet" href="css/theme-wb.css?v=e8204b8">     <style>         .setup-card {             max-width: 440px;             width: 100%;             padding: 32px;             background: var(--card-card-bg);             border: var(--card-border);             border-radius: var(--card-radius);             box-shadow: var(--card-shadow);             backdrop-filter: blur(16px);             text-align: center;             display: flex;             flex-direction: column;             gap: 20px;         }         .setup-title {             font-size: 1.8rem;             font-weight: 800;             color: var(--accent-color);             letter-spacing: 0.5px;         }         .setup-desc {             font-size: 0.95rem;             opacity: 0.85;             line-height: 1.4;         }         .theme-options {             display: flex;             flex-direction: column;             gap: 12px;             margin-top: 10px;         }         .theme-btn {             padding: 16px;             border-radius: 12px;             border: var(--btn-border);             background: var(--btn-bg);             color: var(--btn-text);             font-weight: 700;             font-size: 1.05rem;             cursor: pointer;             transition: all 0.25s ease;             display: flex;             align-items: center;             justify-content: center;             gap: 10px;         }         .theme-btn:hover {             background: var(--btn-hover-bg);             color: var(--btn-hover-text);             transform: translateY(-2px);         }         .back-link {             margin-top: 10px;             font-size: 0.9rem;             color: var(--accent-color);             text-decoration: none;             font-weight: 600;         }         .back-link:hover {             text-decoration: underline;         }     </style> </head> <body>     <div class="setup-card">         <div class="setup-title"><i class="fa-solid fa-wand-magic-sparkles"></i> Tema Seçimi</div>         <div class="setup-desc">Arayüz ruhunuzu seçin: Apple "Lean", Marvel "Stark" veya Warner Bros "Kino".</div>                  <div class="theme-options">             <button class="theme-btn" onclick="window.babarockThemeManager.setTheme('apple')">                 <i class="fa-brands fa-apple"></i> Apple "Lean"             </button>             <button class="theme-btn" onclick="window.babarockThemeManager.setTheme('marvel')">                 <i class="fa-solid fa-shield-halved"></i> Marvel "Stark"             </button>             <button class="theme-btn" onclick="window.babarockThemeManager.setTheme('warnerbros')">                 <i class="fa-solid fa-chess-rook"></i> Warner Bros "Kino"             </button>         </div>          <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Ana Sayfaya Dön</a>     </div>     <script src="js/setup.js?v=e8204b8"></script> </body> </html>
