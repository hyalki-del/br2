<!DOCTYPE html> <html lang="en"> <head>     <meta charset="UTF-8">     <title>Admin Panel - Band Dashboard</title>     <style>         :root { --bg-color: #0d1117; --card-bg: #161b22; --border-color: #30363d; --text-main: #c9d1d9; --accent-color: #238636; --input-bg: #010409; }         * { box-sizing: border-box; margin: 0; padding: 0; }         body { background-color: var(--bg-color); color: var(--text-main); font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }         .admin-container { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; width: 100%; max-width: 600px; padding: 32px; }         .form-group { margin-bottom: 20px; }         label { display: block; font-size: 0.875rem; margin-bottom: 8px; }         input[type="text"], input[type="url"] { width: 100%; padding: 10px; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; color: #fff; }         .btn-submit { width: 100%; padding: 12px; background-color: var(--accent-color); color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }     </style> </head> <body> <div class="admin-container">     <h2>Band Dashboard Configuration</h2>     <form id="configForm">         <div class="form-group"><label>Band Name</label><input type="text" id="bandName" required></div>         <div class="form-group"><label>Band Members (Comma Separated)</label><input type="text" id="bandMembers" required></div>         <div class="form-group"><label>Google Apps Script Web App URL</label><input type="url" id="googleSheetsApiUrl" required></div>         <div class="form-group"><label>Ultimate Guitar Playlist Link</label><input type="url" id="ugPlaylistLink" required></div>         <button type="submit" class="btn-submit">Generate & Download config.json</button>     </form> </div> <script>     document.getElementById('configForm').addEventListener('submit', function(e) {         e.preventDefault();         const data = {             band_name: document.getElementById('bandName').value.trim(),             band_members: document.getElementById('bandMembers').value.split(',').map(m => m.trim()),             google_sheets_api_url: document.getElementById('googleSheetsApiUrl').value.trim(),             ug_playlist_link: document.getElementById('ugPlaylistLink').value.trim(),             active_theme: "base",             created_at: new Date().toISOString()         };         const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });         const a = document.createElement('a');         a.href = URL.createObjectURL(blob);         a.download = 'config.json';         a.click();     }); </script> </body> </html>
