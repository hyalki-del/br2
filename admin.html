<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Band Dashboard Config Generator</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --input-bg: #010409;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-stack);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .admin-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            max-width: 650px;
            padding: 32px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .admin-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .admin-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffffff;
        }

        .admin-header p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        input[type="text"],
        input[type="url"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="url"]:focus,
        textarea:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .help-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .status-box {
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            display: none;
        }

        .status-box.success {
            display: block;
            background-color: rgba(46, 160, 67, 0.15);
            border: 1px solid #2ea043;
            color: #3fb950;
        }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="admin-header">
        <h1>Band Dashboard — Configuration Generator</h1>
        <p>Fill in the required parameters below to generate your <code>config.json</code> file.</p>
    </div>

    <form id="configForm">
        <div class="form-group">
            <label for="bandName">Band Name</label>
            <input type="text" id="bandName" placeholder="e.g., The Velvet Echoes" required>
        </div>

        <div class="form-group">
            <label for="bandMembers">Band Members (Comma Separated)</label>
            <input type="text" id="bandMembers" placeholder="e.g., Alex (Vocals), Maya (Guitar), Sam (Drums)" required>
            <div class="help-text">Enter member names and optional instruments separated by commas.</div>
        </div>

        <div class="form-group">
            <label for="googleSheetsApiUrl">Google Apps Script Web App Deployment URL</label>
            <input type="url" id="googleSheetsApiUrl" placeholder="https://script.google.com/macros/s/.../exec" required>
            <div class="help-text">The Web App endpoint generated from Step 1.</div>
        </div>

        <div class="form-group">
            <label for="ugPlaylistLink">Ultimate Guitar Playlist / Personal Tab Link</label>
            <input type="url" id="ugPlaylistLink" placeholder="https://www.ultimate-guitar.com/user/playlist/..." required>
        </div>

        <button type="submit" class="btn-submit">Generate & Download config.json</button>
    </form>

    <div id="statusBox" class="status-box"></div>
</div>

<script>
    document.getElementById('configForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const bandName = document.getElementById('bandName').value.trim();
        const rawMembers = document.getElementById('bandMembers').value;
        const googleSheetsApiUrl = document.getElementById('googleSheetsApiUrl').value.trim();
        const ugPlaylistLink = document.getElementById('ugPlaylistLink').value.trim();

        // Process members string into array
        const bandMembers = rawMembers.split(',').map(m => m.trim()).filter(m => m.length > 0);

        const configData = {
            band_name: bandName,
            band_members: bandMembers,
            google_sheets_api_url: googleSheetsApiUrl,
            ug_playlist_link: ugPlaylistLink,
            active_theme: "base",
            created_at: new Date().toISOString()
        };

        // Convert JSON to Blob
        const jsonString = JSON.stringify(configData, null, 2);
        const blob = new Blob([jsonString], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        // Trigger Download
        const a = document.createElement('a');
        a.href = url;
        a.download = 'config.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        // Feedback
        const statusBox = document.getElementById('statusBox');
        statusBox.className = "status-box success";
        statusBox.innerHTML = "<strong>config.json generated!</strong> Place this file into the root directory of your GitHub repository and commit changes.";
    });
</script>

</body>
</html>
