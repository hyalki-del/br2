<!DOCTYPE html> <html lang="en"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0">     <title>Admin Panel - Band Dashboard</title>     <style>         :root { --bg-color: #0d1117; --card-bg: #161b22; --border-color: #30363d; --text-main: #c9d1d9; --accent-color: #238636; --input-bg: #010409; }         * { box-sizing: border-box; margin: 0; padding: 0; }         body { background-color: var(--bg-color); color: var(--text-main); font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }         .admin-container { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; width: 100%; max-width: 600px; padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }         h2 { margin-bottom: 24px; font-size: 1.5rem; color: #fff; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }         .form-group { margin-bottom: 20px; }         label { display: block; font-size: 0.875rem; margin-bottom: 8px; font-weight: 600; color: #8b949e; }         input[type="text"], input[type="url"], input[type="file"] { width: 100%; padding: 10px; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 0.95rem; }         input[type="file"] { padding: 8px; cursor: pointer; }         .file-hint { font-size: 0.75rem; color: #8b949e; margin-top: 4px; }         .btn-submit { width: 100%; padding: 12px; background-color: var(--accent-color); color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: background 0.2s; }         .btn-submit:hover { opacity: 0.9; }     </style> </head> <body> <div class="admin-container">     <h2>Band Dashboard Configuration</h2>     <form id="configForm">         <div class="form-group">             <label>Band Name</label>             <input type="text" id="bandName" required placeholder="e.g. The Midnight Echo">         </div>         <div class="form-group">             <label>Band Members (Comma Separated)</label>             <input type="text" id="bandMembers" required placeholder="Alex, Jordan, Taylor">         </div>         <div class="form-group">             <label>Google Apps Script Web App URL</label>             <input type="url" id="googleSheetsApiUrl" required placeholder="https://script.google.com/macros/s/.../exec">         </div>         <div class="form-group">             <label>Ultimate Guitar Playlist Link</label>             <input type="url" id="ugPlaylistLink" required placeholder="https://www.ultimate-guitar.com/user/playlist/...">         </div>         <div class="form-group">             <label>Band Photos (Select multiple for background shuffle)</label>             <input type="file" id="bandPhotosInput" accept="image/*" multiple>             <div class="file-hint">Images will be embedded safely into config.json for background shuffling.</div>         </div>         <button type="submit" class="btn-submit">Generate & Download config.json</button>     </form> </div> <script>     document.getElementById('configForm').addEventListener('submit', async function(e) {         e.preventDefault();         const fileInput = document.getElementById('bandPhotosInput');         let photoBase64List = [];          if (fileInput.files && fileInput.files.length > 0) {             for (let file of fileInput.files) {                 const base64String = await toBase64(file);                 photoBase64List.push(base64String);             }         }          const data = {             band_name: document.getElementById('bandName').value.trim(),             band_members: document.getElementById('bandMembers').value.split(',').map(m => m.trim()),             google_sheets_api_url: document.getElementById('googleSheetsApiUrl').value.trim(),             ug_playlist_link: document.getElementById('ugPlaylistLink').value.trim(),             band_photos: photoBase64List,             active_theme: "base",             created_at: new Date().toISOString()         };          const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });         const a = document.createElement('a');         a.href = URL.createObjectURL(blob);         a.download = 'config.json';         a.click();     });      const toBase64 = file => new Promise((resolve, reject) => {         const reader = new FileReader();         reader.readAsDataURL(file);         reader.onload = () => resolve(reader.result);         reader.onerror = error => reject(error);     }); </script> </body> </html>
