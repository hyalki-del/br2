name: Universal Payload Execution Engine

on:
  workflow_dispatch:
    inputs:
      code_payload:
        description: 'Paste your complete execution text payload here'
        required: true
        type: string

permissions:
  contents: write

jobs:
  execute_payload:
    runs-on: ubuntu-latest
    name: Execute Dynamic File Payload

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Environment & Dependencies
        run: |
          mkdir -p core .github/workflows songs
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Save Payload & Execute Bash Script
        env:
          PAYLOAD_TEXT: ${{ inputs.code_payload }}
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
        run: |
          # Write the input payload to a temp execution script
          echo "$PAYLOAD_TEXT" > execute_payload.sh
          chmod +x execute_payload.sh

          # Execute the payload
          ./execute_payload.sh

          # Cleanup temp script
          rm execute_payload.sh

      - name: Commit and Push All Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          
          if git diff --staged --quiet; then
            echo "No repository changes detected after payload execution."
          else
            git commit -m "build(payload): executed remote text payload update"
            git push
          fi
