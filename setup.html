 <!DOCTYPE html> <html lang="tr"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">     <title>Baba Rock - Ayarlar & Tema</title>     <script>         (function() {             const savedTheme = localStorage.getItem('babarock_theme') || 'apple';             document.documentElement.setAttribute('data-theme', savedTheme);         })();     </script>     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">     <link rel="stylesheet" href="css/core.css?v=b77765c">     <link rel="stylesheet" href="css/theme-apple.css?v=b77765c">     <link rel="stylesheet" href="css/theme-marvel.css?v=b77765c">     <link rel="stylesheet" href="css/theme-wb.css?v=b77765c">     <style>         .page-card {             max-width: 480px;             width: 100%;             padding: 28px;             background: rgba(18, 18, 18, 0.92);             border: 1px solid var(--hex-border);             border-radius: 20px;             box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);             backdrop-filter: blur(10px);             margin: auto;             text-align: center;         }         .theme-buttons {             display: flex;             flex-direction: column;             gap: 12px;             margin-top: 20px;         }         .theme-btn {             padding: 14px;             border-radius: 12px;             border: 1px solid var(--hex-border);             background: rgba(255, 255, 255, 0.05);             color: #fff;             font-weight: 600;             cursor: pointer;             transition: all 0.2s;         }         .theme-btn:hover {             border-color: var(--hex-accent);             background: rgba(255, 255, 255, 0.1);         }     </style> </head> <body>     <div class="page-card">         <h2><i class="fa-solid fa-sliders"></i> Merkezi Tema Yönetimi</h2>         <p style="color: #aaa; font-size: 0.9rem; margin-top: 6px;">Uygulama genel görünümünü CSS katmanından anında değiştirin.</p>         <div class="theme-buttons">             <button class="theme-btn" onclick="changeTheme('apple')">Apple Minimal Tema</button>             <button class="theme-btn" onclick="changeTheme('marvel')">Marvel Red Tema</button>             <button class="theme-btn" onclick="changeTheme('warnerbros')">Warner Bros Gold Tema</button>         </div>         <div style="margin-top: 24px;">             <a href="index.html" class="nav-btn" style="color: var(--hex-accent); text-decoration: none;">                 <i class="fa-solid fa-arrow-left"></i> Ana Sayfaya Dön             </a>         </div>     </div>     <script>         function changeTheme(themeName) {             document.documentElement.setAttribute('data-theme', themeName);             localStorage.setItem('babarock_theme', themeName);         }     </script>     <script src="js/setup.js?v=b77765c"></script>     <script src="js/script.js?v=b77765c"></script> </body> </html>
