name: Tum Kodlari Birlestir ve Bilgi Uret

on:
  workflow_dispatch:

jobs:
  combine-files:
    runs-on: ubuntu-latest
    steps:
      - name: Repositoriyi Klonla
        uses: actions/checkout@v4

      - name: Kod Dosyalarını Tek Dosyada Birleştir ve Bilgi Dosyası Oluştur
        run: |
          OUTPUT_FILE="tum_kodlar.txt"
          INFO_FILE="bilgi.txt"
          
          # --- 1. KODLARI BİRLEŞTİRME İŞLEMİ ---
          echo "=== PROJE KODLARI BIRLESTIRILDI ===" > $OUTPUT_FILE
          echo "" >> $OUTPUT_FILE

          find . -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.json" -o -name "*.md" \) \
            ! -path "*/.*" \
            ! -path "*/node_modules/*" \
            ! -path "*/dist/*" \
            ! -path "*/build/*" | sort | while read -r file; do
              echo "--------------------------------------------------------------------------------" >> $OUTPUT_FILE
              echo "DOSYA: $file" >> $OUTPUT_FILE
              echo "--------------------------------------------------------------------------------" >> $OUTPUT_FILE
              cat "$file" >> $OUTPUT_FILE
              echo -e "\n\n" >> $OUTPUT_FILE
          done

          # --- 2. BİLGİ.TXT VE KLASÖR YAPISI OLUŞTURMA İŞLEMİ ---
          echo "=== BABA ROCK PWA - PROJE BILGI VE KLASOR YAPISI ===" > $INFO_FILE
          echo "Olusturma Tarihi: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $INFO_FILE
          echo "" >> $INFO_FILE
          echo "--- PROJE DIZIN AGACI ---" >> $INFO_FILE
          
          # tree komutu yoksa alternatif olarak find ile dizin yapısını basalım
          find . -print | sed -e 's;[^/]*/;|____;g;s;____|; |   ñones;g' >> $INFO_FILE
          
          echo "" >> $INFO_FILE
          echo "--- PROJE DOSYA ENVANTERİ ---" >> $INFO_FILE
          find . -type f ! -path "*/.*" | sort >> $INFO_FILE

      - name: Oluşan Kod Dosyasını Çıktı (Artifact) Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: tum_kodlar_dosyasi
          path: |
            tum_kodlar.txt
            bilgi.txt
