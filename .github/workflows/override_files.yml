      - name: Unpack Web Frontend Payload Files
        env:
          RAW_INPUT: ${{ inputs.code_payload }}
        run: |
          python3 - << 'PYEOF'
          import os, re

          raw_text = os.environ.get("RAW_INPUT", "").strip()
          if not raw_text:
              print("[Workflow] Frontend payload input was empty; skipping web file updates.")
              exit(0)

          pattern = r"===\s*FILE:\s*([^\s=]+(?:\/[^\s=]+)*)\s*==="
          tokens = re.split(pattern, raw_text)

          if len(tokens) >= 3:
              for i in range(1, len(tokens), 2):
                  filepath = tokens[i].strip()
                  content = tokens[i+1]
                  if filepath == "scraper.py":
                      continue  # Protect scraper.py from being overwritten by form flattening
                  dirpath = os.path.dirname(filepath)
                  if dirpath:
                      os.makedirs(dirpath, exist_ok=True)
                  with open(filepath, "w", encoding="utf-8", newline="\n") as f:
                      f.write(content.strip() + "\n")
                  print(f"[Engine] Written web asset: {filepath}")
          PYEOF

      - name: Execute Automated Scraper
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
        run: |
          python3 scraper.py

      - name: Commit and Push Updated State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "build(payload): executed automated payload update"
            git push
          fi
