 <!DOCTYPE html> <html lang="en"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">     <title>Baba Rock - Takvim</title>      <script>         (function() {             const savedTheme = localStorage.getItem('babarock_theme') || 'default';             document.documentElement.setAttribute('data-theme', savedTheme);         })();     </script>      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">     <link rel="stylesheet" href="css/core.css?v=BUILD_SHA">     <link rel="stylesheet" href="css/theme-apple.css?v=BUILD_SHA">     <link rel="stylesheet" href="css/theme-marvel.css?v=BUILD_SHA">     <link rel="stylesheet" href="css/theme-wb.css?v=BUILD_SHA">      <style>         .calendar-card {             max-width: 500px;             width: 100%;             padding: 24px;             background: rgba(18, 18, 18, 0.92);             border: 1px solid var(--hex-border);             border-radius: 20px;             box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);             backdrop-filter: blur(12px);             -webkit-backdrop-filter: blur(12px);             display: flex;             flex-direction: column;             gap: 16px;         }          .header-nav {             display: flex;             justify-content: space-between;             align-items: center;             border-bottom: 1px solid rgba(255, 255, 255, 0.15);             padding-bottom: 12px;         }          .header-nav h2 {             font-size: 1.4rem;             color: #fff;             display: flex;             align-items: center;             gap: 10px;         }          .btn-back {             padding: 8px 16px;             background: var(--hex-border);             color: #fff;             text-decoration: none;             border-radius: 8px;             font-weight: 700;             font-size: 0.85rem;             transition: background 0.3s ease;         }          .events-list {             display: flex;             flex-direction: column;             gap: 14px;             max-height: 60vh;             overflow-y: auto;             padding-right: 4px;         }          .event-item {             background: rgba(255, 255, 255, 0.05);             border: 1px solid rgba(255, 255, 255, 0.12);             border-left: 4px solid var(--hex-border);             border-radius: 10px;             padding: 14px;             display: flex;             flex-direction: column;             gap: 6px;         }          .event-date {             font-size: 0.8rem;             color: var(--hex-icon);             font-weight: 700;             text-transform: uppercase;             display: flex;             justify-content: space-between;         }          .event-title {             font-size: 1.1rem;             font-weight: 700;             color: #ffffff;         }          .event-venue {             font-size: 0.85rem;             color: #bbb;             display: flex;             align-items: center;             gap: 6px;         }          .event-info {             font-size: 0.8rem;             color: #888;             margin-top: 4px;         }          .badge {             padding: 2px 8px;             border-radius: 4px;             font-size: 0.7rem;             text-transform: uppercase;             background: rgba(255, 255, 255, 0.1);             color: #fff;         }     </style> </head> <body>      <div class="bg-container">         <img id="fullBgImage" src="https://hyalki-del.github.io/babarock/9E3DB23C-F5C1-438B-91E7-323E8FEE34AD_4_5005_c.jpeg" alt="Background" class="bg-image">     </div>      <div class="dotted-overlay"></div>      <main class="main-wrapper" style="margin-top: 20px;">         <div class="calendar-card">             <div class="header-nav">                 <h2><i class="fa-solid fa-calendar-days"></i> Etkinlik Takvimi</h2>                 <a href="index.html" class="btn-back">Geri</a>             </div>              <div id="eventsContainer" class="events-list">                 <p style="color: #888; text-align: center;">Takvim yükleniyor...</p>             </div>         </div>     </main>      <script>         fetch('events.json?v=' + Date.now())             .then(response => response.json())             .then(data => {                 const container = document.getElementById('eventsContainer');                 if (!data || data.length === 0) {                     container.innerHTML = '<p style="color:#aaa; text-align:center;">Yaklaşan etkinlik bulunamadı.</p>';                     return;                 }                  container.innerHTML = data.map(event => `                     <div class="event-item">                         <div class="event-date">                             <span><i class="fa-regular fa-clock"></i> ${event.date} - ${event.time}</span>                             <span class="badge">${event.type}</span>                         </div>                         <div class="event-title">${event.title}</div>                         <div class="event-venue"><i class="fa-solid fa-location-dot"></i> ${event.venue} (${event.city})</div>                         ${event.info ? `<div class="event-info">${event.info}</div>` : ''}                     </div>                 `).join('');             })             .catch(err => {                 console.error('Events loading error:', err);                 document.getElementById('eventsContainer').innerHTML = '<p style="color:#ff4444; text-align:center;">Takvim verisi yüklenemedi.</p>';             });     </script>     <script src="js/setup.js?v=BUILD_SHA"></script>     <script src="js/script.js?v=BUILD_SHA"></script> </body> </html>
