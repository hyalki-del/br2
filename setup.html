<!DOCTYPE html> <html lang="en"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0">     <title>Theme Setup — Band Dashboard</title>     <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">     <style>         * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }         body { background-color: var(--bg-primary, #0d1117); color: var(--text-main, #c9d1d9); font-family: var(--font-family, sans-serif); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }         .container { width: 100%; max-width: 500px; background: var(--bg-secondary, #161b22); border: 1px solid var(--border-color, #30363d); border-radius: var(--card-radius, 12px); padding: 32px; box-shadow: var(--box-shadow, none); }         h2 { font-size: 1.8rem; margin-bottom: 24px; text-transform: var(--header-transform, none); }         .theme-grid { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }         .theme-btn { padding: 16px; border-radius: 8px; border: 2px solid var(--border-color); background: var(--bg-surface); color: var(--text-main); font-size: 1.1rem; font-weight: bold; cursor: pointer; text-align: left; transition: all 0.2s; }         .theme-btn:hover { border-color: var(--accent-color); transform: translateY(-2px); }         .back-link { display: inline-block; color: var(--accent-color); text-decoration: none; font-weight: 600; }         .back-link:hover { text-decoration: underline; }     </style> </head> <body> <div class="container">     <h2>Select App Theme</h2>     <div class="theme-grid">         <button class="theme-btn" onclick="selectTheme('hero')">⚡ Hero Theme (Oswald / Crimson)</button>         <button class="theme-btn" onclick="selectTheme('base')"> Base Theme (Apple Clean / Blue)</button>         <button class="theme-btn" onclick="selectTheme('rams')">📻 Rams Theme (Braun Minimal / Orange)</button>     </div>     <a href="index.html" class="back-link">← Back to Dashboard</a> </div>  <script src="core/app.js"></script> <script>     function selectTheme(themeKey) {         if (window.BandApp && typeof window.BandApp.saveThemeSelection === 'function') {             window.BandApp.saveThemeSelection(themeKey);             alert(`Theme successfully switched to: ${themeKey.toUpperCase()}`);         } else {             localStorage.setItem("band_app_theme", themeKey);             location.reload();         }     } </script> </body> </html>
