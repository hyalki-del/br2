<!DOCTYPE html> <html lang="en"> <head>     <meta charset="UTF-8">     <title>Playlist & Setlist</title>     <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">     <style>         * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.2s, color 0.2s; }         body { background-color: var(--bg-primary, #f5f5f7); color: var(--text-main, #1d1d1f); font-family: var(--font-family, sans-serif); min-height: 100vh; padding: 30px 16px; display: flex; flex-direction: column; align-items: center; }         .container { width: 100%; max-width: 950px; }         header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }         .btn { padding: 8px 16px; background-color: var(--accent-color, #0071e3); color: #fff; border: none; border-radius: var(--card-radius, 6px); font-weight: 600; cursor: pointer; }         .playlist-card { background-color: var(--bg-secondary, #ffffff); border: 1px solid var(--border-color, #d2d2d7); border-radius: var(--card-radius, 12px); overflow: hidden; }         .song-list { list-style: none; }         .song-item { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border-color, #e5e5ea); }         .drag-handle { cursor: grab; padding-right: 14px; color: var(--text-muted); }         .song-index { width: 32px; font-weight: 700; color: var(--text-muted); }         .song-details { flex-grow: 1; }         .song-title { font-weight: 600; color: var(--text-main); text-decoration: none; cursor: pointer; }         .song-title:hover { color: var(--accent-color); text-decoration: underline; }         .artist-name { font-size: 0.825rem; color: var(--text-muted); }         .rhs-controls { display: flex; align-items: center; gap: 12px; }         .key-input { width: 55px; padding: 4px; text-align: center; text-transform: uppercase; border: 1px solid var(--border-color); border-radius: 4px; }         .play-btn { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background-color: var(--bg-surface); color: var(--accent-color); text-decoration: none; }     </style> </head> <body> <div class="container">     <header>         <div><h1>Band Setlist</h1><p id="song-count-meta">Loading setlist...</p></div>         <div><button class="btn" onclick="shufflePlaylist()">🔀 Shuffle</button> <button class="btn" onclick="saveOrderToRemote()">💾 Save Order</button></div>     </header>     <div class="playlist-card"><ul class="song-list" id="songList"></ul></div>     <div style="text-align:center; margin-top:20px;"><a href="index.html" style="color:var(--accent-color);">← Back to Landing Page</a></div> </div> <script src="core/app.js"></script> <script>     let currentSongs = [];     async function fetchPlaylistData() {         try {             const res = await fetch("playlist.json");             if (res.ok) { currentSongs = await res.json(); renderPlaylist(currentSongs); }         } catch (e) {}         if (window.BandApp && window.BandApp.config && window.BandApp.config.google_sheets_api_url) {             try {                 const apiRes = await fetch(`${window.BandApp.config.google_sheets_api_url}?action=readTab&tab=song-info`);                 const json = await apiRes.json();                 if (json.status === "success" && json.data.length > 0) {                     currentSongs = json.data.map((r, idx) => ({ index: r.Index || (idx + 1), songName: r["Song Name"] || "", artistName: r["Artist Name"] || "", key: r.Key || "" }));                     renderPlaylist(currentSongs);                 }             } catch (err) {}         }     }     function renderPlaylist(songs) {         const list = document.getElementById("songList");         list.innerHTML = "";         document.getElementById("song-count-meta").innerText = `${songs.length} Tracks in Setlist`;         songs.forEach((song, idx) => {             const li = document.createElement("li");             li.className = "song-item";             const ytUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(song.songName + ' ' + song.artistName)}`;             const safeSong = song.songName.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');             const safeArtist = song.artistName.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');             const lyricsFile = `${idx + 1}-${safeSong}-${safeArtist}.txt`;              li.innerHTML = `                 <div class="drag-handle">⋮⋮</div>                 <div class="song-index">${idx + 1}</div>                 <div class="song-details">                     <a class="song-title" onclick="openLyricsViewer('${song.songName}', '${song.artistName}', '${lyricsFile}')">${song.songName}</a>                     <div class="artist-name">${song.artistName}</div>                 </div>                 <div class="rhs-controls">                     <input type="text" class="key-input" value="${song.key || ''}" onchange="updateKey('${song.songName}', '${song.artistName}', this.value)" placeholder="KEY">                     <a href="${ytUrl}" target="_blank" class="play-btn">▶</a>                 </div>             `;             list.appendChild(li);         });     }     function shufflePlaylist() {         for (let i = currentSongs.length - 1; i > 0; i--) {             const j = Math.floor(Math.random() * (i + 1));             [currentSongs[i], currentSongs[j]] = [currentSongs[j], currentSongs[i]];         }         renderPlaylist(currentSongs);     }     async function saveOrderToRemote() {         if (window.BandApp && window.BandApp.config && window.BandApp.config.google_sheets_api_url) {             await fetch(window.BandApp.config.google_sheets_api_url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "savePlaylistOrder", payload: { songs: currentSongs } }) });         }     }     async function updateKey(songName, artistName, newKey) {         if (window.BandApp && window.BandApp.config && window.BandApp.config.google_sheets_api_url) {             await fetch(window.BandApp.config.google_sheets_api_url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "updateSongKey", payload: { songName, artistName, key: newKey } }) });         }     }     function openLyricsViewer(title, artist, filename) {         const w = window.open("", "_blank");         w.document.write(`             <!DOCTYPE html><html><head><title>${title} - ${artist}</title>             <style>body{background:#000;color:#fff;font-family:'Courier New',monospace;padding:24px;}             pre{white-space:pre-wrap;word-wrap:break-word;line-height:1.6;font-size:18px;}</style></head>             <body><h2>${title}</h2><p style="color:#888;">${artist}</p><hr style="border-color:#333;margin:16px 0;">             <pre id="lyricsText">Loading lyrics...</pre>             <script>fetch('songs/${filename}').then(r=>r.text()).then(t=>document.getElementById('lyricsText').innerText=t).catch(e=>document.getElementById('lyricsText').innerText='Lyrics unavailable.');<\/script></body></html>         `);         w.document.close();     }     document.addEventListener("DOMContentLoaded", fetchPlaylistData); </script> </body> </html>
